    // --- 10. Reservation & Auto-Settlement Modal (with Automated Guest SMS Generation) ---
    function ReservationModal({
      isOpen,
      onClose,
      onSave,
      onDelete,
      onOpenSmsModal,
      smsTemplates,
      initialData,
      defaultRoomId,
      defaultDate,
      rooms,
      platforms,
      selectedYear,
      selectedMonth,
      currentMonthBookedNights
    }) {
      const isEdit = Boolean(initialData);

      const getDefaultCheckOut = (inDateStr) => {
        const d = parseDate(inDateStr || getTodayDateStr());
        d.setDate(d.getDate() + 7);
        return formatDateStr(d);
      };

      const [roomId, setRoomId] = useState(initialData?.roomId || defaultRoomId || (rooms[0]?.id || '101'));
      const [guestName, setGuestName] = useState(initialData?.guestName || '');
      const [guestPhone, setGuestPhone] = useState(initialData?.guestPhone || '');
      const [checkIn, setCheckIn] = useState(initialData?.checkIn || defaultDate || getTodayDateStr());
      const [checkOut, setCheckOut] = useState(initialData?.checkOut || getDefaultCheckOut(defaultDate || getTodayDateStr()));
      const [platform, setPlatform] = useState(initialData?.platform || (platforms[0]?.name || '삼삼엠투'));
      const [totalAmount, setTotalAmount] = useState(initialData?.totalAmount ?? 350000);
      const [cleaningFee, setCleaningFee] = useState(() => {
        if (initialData?.cleaningFee !== undefined) return initialData.cleaningFee;
        const foundRoom = rooms.find(r => r.id === (defaultRoomId || '101'));
        return foundRoom ? foundRoom.cleaningFeeDefault : 40000;
      });
      const [commissionRate, setCommissionRate] = useState(() => {
        if (initialData?.commissionRate !== undefined) return initialData.commissionRate;
        const foundPlt = platforms[0];
        return foundPlt ? foundPlt.rate : 3.3;
      });
      const [cleaningDone, setCleaningDone] = useState(initialData?.cleaningDone || false);
      const [cleanerName, setCleanerName] = useState(initialData?.cleanerName || '박여사님');
      const [memo, setMemo] = useState(initialData?.memo || '');

      // Auto-SMS Trigger on Save State
      const [autoTriggerSms, setAutoTriggerSms] = useState(!isEdit);
      const [autoSmsType, setAutoSmsType] = useState('confirm');
      const [showSmsPreview, setShowSmsPreview] = useState(false);

      const handlePlatformChange = (newPlatformName) => {
        setPlatform(newPlatformName);
        const found = platforms.find(p => p.name === newPlatformName);
        if (found) {
          setCommissionRate(found.rate);
        }
      };

      const handleRoomChange = (newRoomId) => {
        setRoomId(newRoomId);
        if (!isEdit) {
          const found = rooms.find(r => r.id === newRoomId);
          if (found) setCleaningFee(found.cleaningFeeDefault);
        }
      };

      // --- Required Auto-Calculation Formulas ---
      const nights = getDaysDiff(checkIn, checkOut);
      const numericTotal = Number(totalAmount) || 0;
      const numericCleaning = Number(cleaningFee) || 0;
      const numericRate = Number(commissionRate) || 0;
      const commissionAmount = Math.round(numericTotal * (numericRate / 100));
      const netProfit = numericTotal - (numericCleaning + commissionAmount);

      const checkInDateObj = checkIn ? parseDate(checkIn) : new Date();
      const targetYear = checkInDateObj.getFullYear() || selectedYear;
      const targetMonth = (checkInDateObj.getMonth() + 1) || selectedMonth;
      const daysInTargetMonth = getMonthTotalDays(targetYear, targetMonth);
      const roomCount = Math.max(1, rooms.length);
      const totalCapacityNights = daysInTargetMonth * roomCount;
      const thisResNightsInMonth = getBookedNightsInMonth(checkIn, checkOut, targetYear, targetMonth);

      const prevNightsInMonth = isEdit
        ? getBookedNightsInMonth(initialData.checkIn, initialData.checkOut, selectedYear, selectedMonth)
        : 0;
      const projectedMonthBookedNights = Math.min(
        totalCapacityNights,
        Math.max(0, currentMonthBookedNights - prevNightsInMonth + thisResNightsInMonth)
      );
      const projectedOccupancyRate = totalCapacityNights > 0
        ? ((projectedMonthBookedNights / totalCapacityNights) * 100).toFixed(1)
        : '0.0';
      const singleResOccupancyShare = totalCapacityNights > 0
        ? ((thisResNightsInMonth / totalCapacityNights) * 100).toFixed(1)
        : '0.0';

      const selectedRoomObj = rooms.find(r => r.id === roomId) || rooms[0];
      const draftReservationObj = {
        ...(initialData || {}),
        id: initialData?.id || `RES-${Date.now()}`,
        roomId,
        guestName: guestName.trim() || '예약자',
        guestPhone: guestPhone.trim(),
        checkIn,
        checkOut,
        nights,
        platform,
        totalAmount: numericTotal,
        cleaningFee: numericCleaning,
        commissionRate: numericRate,
        cleaningDone,
        cleanerName,
        memo: memo.trim()
      };

      const liveSmsPreviewText = buildAutoSmsMessage(autoSmsType, draftReservationObj, selectedRoomObj, smsTemplates);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!guestName.trim()) {
          alert('예약자명을 입력해주세요.');
          return;
        }
        if (nights <= 0) {
          alert('퇴실일은 입실일보다 이후 날짜여야 합니다.');
          return;
        }
        onSave(
          {
            ...draftReservationObj,
            guestName: guestName.trim()
          },
          autoTriggerSms ? autoSmsType : null
        );
      };

      if (!isOpen) return null;

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
          <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden my-auto">
            <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <Icon name="calculator" className="w-5 h-5 text-emerald-400" />
                <h3 className="font-bold text-base sm:text-lg">
                  {isEdit ? '예약 및 정산 내역 수정' : '신규 예약 및 정산 입력'}
                </h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1 cursor-pointer">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-5 sm:p-6 space-y-5 max-h-[85vh] overflow-y-auto">
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">객실 선택 *</label>
                  <select
                    value={roomId}
                    onChange={(e) => handleRoomChange(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    {rooms.map((rm) => (
                      <option key={rm.id} value={rm.id}>{rm.id}호 ({rm.name})</option>
                    ))}
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">예약자명 *</label>
                  <input
                    type="text"
                    required
                    value={guestName}
                    onChange={(e) => setGuestName(e.target.value)}
                    placeholder="예: 홍길동"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">예약자 연락처 (문자 발송용)</label>
                  <input
                    type="text"
                    value={guestPhone}
                    onChange={(e) => setGuestPhone(e.target.value)}
                    placeholder="010-0000-0000"
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">입실일 (Check-in) *</label>
                  <input
                    type="date"
                    required
                    value={checkIn}
                    onChange={(e) => setCheckIn(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1.5">퇴실일 (Check-out) *</label>

    // --- 10-B. Automated Guest SMS Generation & Smartphone Direct Link Modal ---
    function AutoSMSModal({
      isOpen,
      reservation,
      defaultTemplate,
      rooms,
      smsTemplates,
      phoneGatewayConfig,
      onOpenPhoneSyncModal,
      onUpdateSmsTemplates,
      onRecordSmsSent,
      onClose,
      showToast
    }) {
      const [activeType, setActiveType] = useState(defaultTemplate || 'confirm');
      const [phoneInput, setPhoneInput] = useState(reservation?.guestPhone || '');
      const [messageText, setMessageText] = useState('');
      const [isEditingTemplate, setIsEditingTemplate] = useState(false);
      const [templateDraft, setTemplateDraft] = useState('');
      const [showQrPanel, setShowQrPanel] = useState(true);
      const [isSendingWebhook, setIsSendingWebhook] = useState(false);

      const roomObj = useMemo(() => {
        return rooms.find(r => r.id === reservation?.roomId) || rooms[0];
      }, [rooms, reservation]);

      useEffect(() => {
        if (reservation) {
          setPhoneInput(reservation.guestPhone || '');
          const generated = buildAutoSmsMessage(activeType, reservation, roomObj, smsTemplates);
          setMessageText(generated);
          setTemplateDraft((smsTemplates && smsTemplates[activeType]) || DEFAULT_SMS_TEMPLATES[activeType]);
        }
      }, [reservation, activeType, roomObj, smsTemplates]);

      if (!isOpen || !reservation) return null;

      const cleanPhone = (phoneInput || '').replace(/[^0-9+]/g, '');
      const smsQrPayload = `SMSTO:${cleanPhone || '01000000000'}:${messageText}`;
      const qrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=8&data=${encodeURIComponent(smsQrPayload)}`;

      const handleCopySmsText = async () => {
        try {
          await navigator.clipboard.writeText(messageText);
          onRecordSmsSent(reservation.id, activeType, messageText);
          if (showToast) showToast('문자 내용이 복사되었으며 발송 이력이 기록되었습니다!');
        } catch (err) {
          alert('문자 내용이 복사되었습니다.');
        }
      };

      const handleSendDeviceSms = () => {
        if (!cleanPhone) {
          alert('수신자 휴대폰 번호를 입력해주세요.');
          return;
        }
        onRecordSmsSent(reservation.id, activeType, messageText);
        const ua = navigator.userAgent.toLowerCase();
        const sep = ua.indexOf('iphone') > -1 || ua.indexOf('ipad') > -1 ? '&' : '?';
        window.location.href = `sms:${cleanPhone}${sep}body=${encodeURIComponent(messageText)}`;
      };

      const handleNativeMobileShare = async () => {
        if (navigator.share) {
          try {
            await navigator.share({
              title: `${reservation.roomId}호 ${reservation.guestName}님 안내문자`,
              text: messageText
            });
            onRecordSmsSent(reservation.id, activeType, messageText);
          } catch (e) {}
        } else {
          handleCopySmsText();
        }
      };

      const handleSendViaSmartphoneGateway = async () => {
        if (!cleanPhone) {
          alert('수신자 휴대폰 번호를 입력해주세요.');
          return;
        }
        if (!phoneGatewayConfig?.webhookUrl) {
          if (window.confirm('스마트폰 원격 문자 게이트웨이(Webhook URL)가 아직 설정되지 않았습니다.\n지금 [스마트폰 연동 설정] 창을 열어 설정하시겠습니까?\n(설정 없이 지금 바로 보내려면 우측 QR코드를 스마트폰 카메라로 스캔하세요!)')) {
            if (onOpenPhoneSyncModal) onOpenPhoneSyncModal();
          }
          return;
        }
        setIsSendingWebhook(true);
        try {
          await fetch(phoneGatewayConfig.webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              to: cleanPhone,
              phone: cleanPhone,
              message: messageText,
              text: messageText,
              sender: phoneGatewayConfig.senderPhone || '',
              secret: phoneGatewayConfig.apiSecret || '',
              roomId: reservation.roomId,
              guestName: reservation.guestName
            })
          });
          onRecordSmsSent(reservation.id, activeType, messageText);
          if (showToast) showToast('스마트폰 게이트웨이로 원격 문자 발송 요청이 전송되었습니다!');
          onClose();
        } catch (err) {
          onRecordSmsSent(reservation.id, activeType, messageText);
          alert('스마트폰 웹훅으로 발송 신호를 보냈습니다. (네트워크/CORS 설정을 확인해주세요)');
        } finally {
          setIsSendingWebhook(false);
        }
      };

      const handleSaveCustomTemplate = () => {
        const next = { ...smsTemplates, [activeType]: templateDraft };
        onUpdateSmsTemplates(next);
        setIsEditingTemplate(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
          <div className="bg-white w-full max-w-3xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden my-auto">
            <div className="px-6 py-4 bg-gradient-to-r from-indigo-900 via-slate-900 to-blue-900 text-white flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center">
                  <Icon name="smartphone" className="w-5 h-5 text-emerald-300" />
                </div>
                <div>
                  <span className="text-[11px] font-bold bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full">
                    PC ↔ 스마트폰 실시간 문자 연동 시스템
                  </span>
                  <h3 className="font-bold text-base sm:text-lg mt-0.5">
                    {reservation.roomId}호 · {reservation.guestName}님 안내 문자 자동 발생
                  </h3>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-300 hover:text-white p-1 cursor-pointer">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-5 sm:p-6 space-y-4 max-h-[85vh] overflow-y-auto">
              {/* 4 Template Type Selector Tabs */}
              <div>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-xs font-bold text-slate-600">
                    발생시킬 문자 종류 선택 (객실 도어락·Wi-Fi·입퇴실일이 자동 입력됩니다)
                  </label>
                  <button
                    type="button"
                    onClick={() => setShowQrPanel(!showQrPanel)}
                    className="text-xs font-bold text-indigo-600 hover:underline cursor-pointer"
                  >
                    {showQrPanel ? '스마트폰 QR 패널 숨기기' : '📱 스마트폰 QR 스캔 패널 보기'}
                  </button>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {SMS_TEMPLATE_META.map((meta) => {
                    const active = activeType === meta.key;
                    return (
                      <button
                        key={meta.key}
                        type="button"
                        onClick={() => setActiveType(meta.key)}
                        className={`p-2.5 rounded-xl border text-left transition cursor-pointer ${
                          active
                            ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                        }`}
                      >
                        <div className="font-extrabold text-xs">{meta.label}</div>
                        <div className={`text-[10px] mt-0.5 ${active ? 'text-indigo-100' : 'text-slate-500'}`}>
                          {meta.desc}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Recipient & Auto-Filled Room Info Summary */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">수신 예약자 휴대폰 번호</label>
                  <div className="flex items-center gap-2">
                    <input
                      type="text"
                      value={phoneInput}
                      onChange={(e) => setPhoneInput(e.target.value)}
                      placeholder="010-0000-0000"
                      className="flex-1 px-3 py-2 rounded-lg border border-slate-300 bg-white font-bold text-sm"
                    />
                    {cleanPhone && (
                      <a
                        href={`tel:${cleanPhone}`}
                        className="px-3 py-2 rounded-lg bg-slate-900 text-white font-bold text-xs flex items-center gap-1 whitespace-nowrap"
                        title="스마트폰에서 바로 전화걸기"
                      >
                        <Icon name="phone" className="w-3.5 h-3.5" />
                        <span>전화</span>
                      </a>
                    )}
                  </div>
                </div>
                <div className="space-y-1 flex flex-col justify-center">
                  <div className="flex items-center justify-between">
                    <span className="text-slate-500">자동 연동 호실 / 도어락:</span>
                    <strong className="text-slate-900">{roomObj?.id}호 / 비밀번호 {roomObj?.doorlockPin}</strong>
                  </div>
                  <div className="flex items-center justify-between">
                    <span className="text-slate-500">자동 연동 와이파이:</span>
                    <strong className="text-blue-700">{roomObj?.wifiInfo}</strong>
                  </div>
                </div>
              </div>

              {/* Main Content Grid: Message Editor + Smartphone QR Direct Scan Box */}
              <div className={`grid grid-cols-1 ${showQrPanel ? 'lg:grid-cols-3' : ''} gap-4 items-stretch`}>
                <div className={`${showQrPanel ? 'lg:col-span-2' : ''} space-y-1.5 flex flex-col`}>
                  <div className="flex items-center justify-between">
                    <label className="text-xs font-bold text-slate-700">
                      자동 생성된 문자 메시지 본문 (수정 시 QR코드에도 실시간 반영)
                    </label>
                    <button
                      type="button"
                      onClick={() => setIsEditingTemplate(!isEditingTemplate)}
                      className="text-xs font-bold text-indigo-600 hover:underline cursor-pointer"
                    >
                      {isEditingTemplate ? '기본 양식 편집 닫기' : '⚙️ 기본 자동문자 양식 수정'}
                    </button>
                  </div>
                  <textarea
                    rows={10}
                    value={messageText}
                    onChange={(e) => setMessageText(e.target.value)}
                    className="w-full flex-1 p-3.5 rounded-xl border border-slate-300 text-xs sm:text-sm leading-relaxed font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>

                {/* Smartphone Camera QR Code Instant SMS Box */}
                {showQrPanel && (
                  <div className="bg-indigo-50/80 border-2 border-indigo-200 rounded-2xl p-4 flex flex-col items-center justify-between text-center">
                    <div>
                      <span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold bg-indigo-600 text-white">
                        📱 PC → 스마트폰 1초 연동
                      </span>
                      <h4 className="font-extrabold text-indigo-950 text-xs sm:text-sm mt-2">
                        스마트폰 카메라로 QR 스캔 시<br />문자앱이 자동 완성되어 열립니다
                      </h4>
                    </div>

                    <div className="my-3 p-2.5 bg-white rounded-2xl shadow-sm border border-indigo-100">
                      <img
                        src={qrImageUrl}
                        alt="스마트폰 문자 즉시 발송 QR코드"
                        className="w-40 h-40 mx-auto object-contain"

                    </div>

                    <div className="text-[11px] text-indigo-900 space-y-1">
                      <p className="font-bold">수신번호: {phoneInput || '미입력'}</p>
                      <p className="text-indigo-700">
                        아이폰/갤럭시 기본 카메라로 비추면 내 폰에서 즉시 문자가 발송됩니다.
                      </p>
                    </div>
                  </div>
                )}
              </div>

              {/* Custom Template Editor Drawer */}
              {isEditingTemplate && (
                <div className="p-4 rounded-xl bg-amber-50 border border-amber-200 space-y-2.5 text-xs">
                  <div className="flex items-center justify-between">

                    <button

              {/* Smartphone Action Buttons */}
              <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 pt-2 border-t border-slate-200">

                >

                <button
                  type="button"
                  onClick={handleSendViaSmartphoneGateway}

                >

                <button
                  type="button"
                  onClick={handleNativeMobileShare}

                <button
                  type="button"

    }

    // --- 10-C. Smartphone Connection & Company PC Server Sync Center Modal ---
    function SmartphoneSyncModal({
      isOpen,
      onClose,
      appData,
      onRestoreAppData,
      phoneGatewayConfig,
      onUpdatePhoneGatewayConfig,
      serverStatus,
      customServerUrl,
      onUpdateCustomServerUrl,
      onForceSyncServer,
      onPushToServer,
      showToast
    }) {
      const [activeTab, setActiveTab] = useState('server'); // 'server' | 'sync' | 'gateway' | 'install'
      const [syncCodeText, setSyncCodeText] = useState('');
      const [serverUrlDraft, setServerUrlDraft] = useState(customServerUrl || '');
      const [gatewayDraft, setGatewayDraft] = useState(phoneGatewayConfig || {});
      const [isSyncingNow, setIsSyncingNow] = useState(false);
      const fileInputRef = useRef(null);

      useEffect(() => {
        if (phoneGatewayConfig) setGatewayDraft(phoneGatewayConfig);
      }, [phoneGatewayConfig]);

      useEffect(() => {
        setServerUrlDraft(customServerUrl || '');
      }, [customServerUrl]);

      if (!isOpen) return null;

      const lanUrls = (serverStatus?.localUrls || []).filter(u => !u.includes('localhost') && !u.includes('127.0.0.1'));
      const primaryPhoneUrl = customServerUrl || lanUrls[0] || (window.location.protocol.startsWith('http') ? window.location.origin : 'http://localhost:8080');
      const phoneQrImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=${encodeURIComponent(primaryPhoneUrl)}`;

      const handleCopyUrl = async (urlText) => {
        try {
          await navigator.clipboard.writeText(urlText);
          if (showToast) showToast(`접속 주소가 복사되었습니다: ${urlText}`);
        } catch (e) {}
      };

      const handleConnectCustomServer = async () => {
        onUpdateCustomServerUrl(serverUrlDraft);
        setIsSyncingNow(true);
        setTimeout(async () => {
          const ok = await onForceSyncServer();
          setIsSyncingNow(false);
          if (showToast) {
            showToast(ok ? '회사 PC 서버와 실시간 연결되었습니다!' : '서버에 연결하지 못했습니다. 회사PC_서버실행.bat가 켜져있는지 확인하세요.');
          }
        }, 100);
      };

      // Export full data as JSON file (can be sent via KakaoTalk / AirDrop / Email to smartphone)
      const handleExportSyncFile = () => {
        const payload = JSON.stringify(appData, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `포항대도동_스마트폰동기화_${getTodayDateStr()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        if (showToast) showToast('스마트폰 동기화 파일(.json)이 저장되었습니다. 카톡으로 폰에 보내주세요!');
      };

      // Import full data from JSON file on smartphone or PC
      const handleImportSyncFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const parsed = JSON.parse(evt.target.result);
            if (onRestoreAppData(parsed)) {
              onClose();
            }
          } catch (err) {
            alert('동기화 파일을 읽는 중 오류가 발생했습니다.');
          }
        };
        reader.readAsText(file);
      };

      // One-click Copy Sync Code (for KakaoTalk "나에게 보내기")
      const handleCopySyncCode = async () => {
        try {
          const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(appData))));
          await navigator.clipboard.writeText(encoded);
          if (showToast) showToast('전체 데이터 동기화 코드가 복사되었습니다! 카카오톡 [나에게 보내기]에 붙여넣으세요.');
        } catch (err) {
          alert('동기화 코드 복사 중 오류가 발생했습니다.');
        }
      };

      const handleApplySyncCode = () => {
        if (!syncCodeText.trim()) {
          alert('붙여넣을 동기화 코드를 입력해주세요.');
          return;
        }
        try {
          const decoded = decodeURIComponent(escape(atob(syncCodeText.trim())));
          const parsed = JSON.parse(decoded);
          if (onRestoreAppData(parsed)) {
            setSyncCodeText('');
            onClose();
          }
        } catch (err) {
          alert('올바르지 않은 동기화 코드입니다. 복사한 전체 코드를 정확히 붙여넣어 주세요.');
        }
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto">

                    }`}>

                    </span>
                  </div>

                    회사 PC 서버 · 웹 · 스마트폰 어플 실시간 연동 센터

                </div>
              </div>
              <button onClick={onClose} className="text-slate-300 hover:text-white p-1 cursor-pointer">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Sub Tabs */}
            <div className="flex border-b border-slate-200 bg-slate-50 px-4 pt-3 gap-2 overflow-x-auto">
              {[
                { id: 'server', label: '① 회사 PC 서버 · QR 폰접속', icon: 'server' },
                { id: 'install', label: '② 스마트폰 어플(앱) 설치', icon: 'smartphone' },
                { id: 'gateway', label: '③ 문자 원격발송(웹훅)', icon: 'zap' },
                { id: 'sync', label: '④ 카톡/파일 수동백업', icon: 'refresh-cw' }

                <button
                  key={t.id}
                  onClick={() => setActiveTab(t.id)}
                  className={`flex items-center gap-1.5 px-3.5 py-2.5 rounded-t-xl text-xs font-extrabold border-b-2 transition cursor-pointer whitespace-nowrap ${

                          <span>회사 PC 서버 연결 상태 및 접속 주소</span>
                        </h4>
                        {serverStatus?.connected && (
                          <span className="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[11px] font-bold">
                            DB v{serverStatus.version || 1} 동기화중
                          </span>
                        )}
                      </div>

                      {serverStatus?.connected ? (
                        <div className="space-y-2.5 text-xs">
                          <div className="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-900">
                            <strong>✓ 회사 PC 서버가 정상 작동 중입니다!</strong>
                            <p className="mt-0.5 text-emerald-800">
                              PC와 스마트폰이 하나의 중앙 DB(<code className="bg-white/80 px-1 rounded">data/rental_db.json</code>)를 실시간 공유합니다. 어느 기기에서 예약을 입력해도 4초 이내에 모든 기기에 자동 반영됩니다.

                              <div key={idx} className="flex items-center justify-between gap-2 bg-white px-3 py-2 rounded-xl border border-slate-200">
                                <span className="font-mono font-bold text-blue-700 truncate">{url}</span>
                                <button

                                  className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-[11px] cursor-pointer shrink-0"
                                >
                                  복사
                                </button>
                              </div>
                            ))}
                          </div>
                        </div>
                      ) : (
                        <div className="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-950 text-xs space-y-2">
                          <strong className="text-sm block">⚠️ 현재 서버 모드가 아닌 HTML 파일로 직접 열려 있습니다.</strong>
                          <p>
                            회사 PC를 서버로 만들려면 폴더 안의 <strong>[회사PC_서버실행.bat]</strong> 파일을 더블클릭하여 실행하세요! 실행 후 자동으로 <code className="bg-white px-1 rounded">http://localhost:8080</code> 주소로 열리며 스마트폰 접속용 QR 코드가 활성화됩니다.
                          </p>
                        </div>
                      )}

                      {/* Force Sync & Custom Server URL */}
                      <div className="pt-2 border-t border-slate-200 space-y-2 text-xs">

                        </label>
                        <div className="flex flex-wrap gap-2">
                          <input
                            type="text"
                            value={serverUrlDraft}

                            className="flex-1 min-w-[200px] px-3 py-2 rounded-xl border border-slate-300 bg-white font-mono text-xs"

                          {serverStatus?.connected && (
                            <button
                              type="button"
                              onClick={async () => {

                        </div>
                      </div>
                    </div>

                    {/* Right QR Box */}
                    <div className="p-4 rounded-2xl border-2 border-indigo-200 bg-indigo-50/70 flex flex-col items-center justify-between text-center">
                      <div>
                        <span className="inline-block px-2.5 py-0.5 rounded-full bg-indigo-600 text-white text-[11px] font-extrabold">
                          📱 스마트폰 카메라 스캔
                        </span>
                        <h4 className="font-extrabold text-indigo-950 text-xs sm:text-sm mt-2">
                          QR 찍고 스마트폰에서 바로 열기

                      </div>
                      <div className="my-2 p-2 bg-white rounded-2xl border border-indigo-100 shadow-xs">
                        <img src={phoneQrImageUrl} alt="스마트폰 서버 접속 QR" className="w-40 h-40 object-contain" />
                      </div>
                      <div className="text-[11px] text-indigo-900 space-y-1 w-full">
                        <p className="font-mono font-bold truncate bg-white/80 px-2 py-1 rounded">{primaryPhoneUrl}</p>
                        <p className="text-indigo-700">
                          회사 Wi-Fi 연결 후 스마트폰 카메라로 스캔하면 웹/어플로 즉시 연결됩니다.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* External (Outside Office LTE/5G) Access Guide */}
                  <div className="p-4 rounded-2xl border border-slate-200 bg-white space-y-2.5 text-xs">
                    <h4 className="font-extrabold text-slate-900 text-sm flex items-center gap-1.5">
                      <Icon name="globe" className="w-4 h-4 text-emerald-600" />
                      <span>외부(집 · 출장 중 LTE/5G)에서 회사 PC 서버에 접속하는 2가지 방법</span>
                    </h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                        <strong className="text-slate-900 block">방법 A. 회사 공유기 포트포워딩 (고정 접속 추천)</strong>
                        <p className="text-slate-600">
                          1) 폴더의 <strong>[방화벽_포트8080_열기(관리자권한).bat]</strong> 실행<br/>
                          2) 회사 공유기 설정(예: 192.168.0.1) → 포트포워드에서<br/>
                          외부포트 <code className="bg-white px-1 rounded">8080</code> → 내부 IP(<code className="bg-white px-1 rounded">{serverStatus?.ips?.[0] || '회사PC IP'}</code>) <code className="bg-white px-1 rounded">8080</code> 연결<br/>
                          3) 외출 시 <code className="bg-white px-1 rounded">http://회사공인IP:8080</code>으로 어디서나 접속!
                        </p>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-50 border border-slate-200 space-y-1">
                        <strong className="text-slate-900 block">방법 B. 공유기 설정 없이 보안 HTTPS 주소 생성</strong>
                        <p className="text-slate-600">

    function calcAuctionCostSum(c) {
      if (!c) return 0;
      const baseAcq =
        (Number(c.winningBid) || 0) +
        (Number(c.acquisitionTax) || 0) +
        (Number(c.registrationFee) || 0) +
        (Number(c.judicialScrivenerFee) || 0) +
        (Number(c.auctionMiscFee) || 0) +
        (Number(c.ownershipTransferFee) || 0);
      const capTotal =
        (Number(c.capSash) || 0) +
        (Number(c.capBoiler) || 0) +
        (Number(c.capPlumbing) || 0) +
        (Number(c.capElectric) || 0) +
        (Number(c.capBathroom) || 0) +
        (Number(c.capKitchen) || 0) +
        (Number(c.capWaterproof) || 0) +
        (Number(c.capExterior) || 0) +
        (Number(c.capRoof) || 0) +
        (c.includeWallpaperInCap ? (Number(c.nonCapWallpaper) || 0) : 0);
      return baseAcq + capTotal;
    }

    function calcKoreanBasicCapitalGainsTax(taxableBase) {
      if (taxableBase <= 0) return { rate: 0, deduction: 0, nationalTax: 0, localTax: 0, totalTax: 0 };
      let rate = 0.06;
      let deduction = 0;
      if (taxableBase <= 14000000) { rate = 0.06; deduction = 0; }
      else if (taxableBase <= 50000000) { rate = 0.15; deduction = 1260000; }
      else if (taxableBase <= 88000000) { rate = 0.24; deduction = 5760000; }
      else if (taxableBase <= 150000000) { rate = 0.35; deduction = 15440000; }
      else if (taxableBase <= 300000000) { rate = 0.38; deduction = 19940000; }
      else if (taxableBase <= 500000000) { rate = 0.40; deduction = 25940000; }
      else if (taxableBase <= 1000000000) { rate = 0.42; deduction = 35940000; }
      else { rate = 0.45; deduction = 65940000; }
      const nationalTax = Math.max(0, Math.round(taxableBase * rate - deduction));
      const localTax = Math.round(nationalTax * 0.1);
      return { rate: Math.round(rate * 100), deduction, nationalTax, localTax, totalTax: nationalTax + localTax };
    }

                          <td className="py-2 px-2">
                            <input
                              type="text"
                              value={u.memo}
                              onChange={(e) => handleUnitChange(idx, 'memo', e.target.value)}
                              className="w-44 px-2 py-1.5 rounded border border-slate-200"
                            />
                          </td>
                        </tr>
                      ))}
                    </tbody>
                    <tfoot>
                      <tr className="bg-slate-900 text-white font-bold">
                        <td colSpan="2" className="py-3 px-3">7세대 합계 (매수인 승계 보증금 / 월 임대수입)</td>
                        <td className="py-3 px-3 text-right text-amber-300">{formatKRW(totalDeposit)}</td>
                        <td className="py-3 px-3 text-right text-emerald-300">월 {formatKRW(totalMonthlyRent)}</td>
                        <td colSpan="5" className="py-3 px-3 text-slate-300">
                          연간 총 임대수입(월세×12 + 단기임대): <strong className="text-white">{formatKRW(annualRentIncome)}</strong>
                        </td>
                      </tr>
                    </tfoot>
                  </table>
                </div>

                {/* 4. 가격 산정 및 매도 전략 수익률 산출표 */}
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 pt-3">
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                    <span className="text-xs font-bold text-slate-500">연 임대수입 합계 (월×12)</span>
                    <p className="text-lg font-extrabold text-blue-700 mt-1">{formatKRW(annualRentIncome)}</p>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                    <span className="text-xs font-bold text-slate-500">희망 매매가</span>
                    <p className="text-lg font-extrabold text-slate-900 mt-1">{formatKRW(salePrice)}</p>
                  </div>
                  <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                    <span className="text-xs font-bold text-slate-500">매수인 실인수가 (매매가-보증금 총액)</span>
                    <p className="text-lg font-extrabold text-amber-700 mt-1">{formatKRW(netCashNeededByBuyer)}</p>
                  </div>
                  <div className="p-4 rounded-xl bg-emerald-50 border border-emerald-200">
                    <span className="text-xs font-bold text-emerald-800">연 수익률 (총매매가 기준 / 실인수가 기준)</span>
                    <p className="text-lg font-extrabold text-emerald-700 mt-1">
                      {grossYieldPercent}% <span className="text-xs font-bold">(실인수 대비 {leveragedYieldPercent}%)</span>
                    </p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* SUB-VIEW 3: 다가구주택 매도 서류·절차 체크리스트 (포항 대도동 7세대) */}
          {subView === 'checklist' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* 사전 준비 서류 9종 */}
              <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
                <h3 className="font-bold text-slate-900 text-base">2. 매수인 확보 전 점검 서류 (사전 준비 9종)</h3>
                <div className="space-y-2 text-xs">
                  {[
                    { k: 'doc_registry', title: '등기사항전부증명서(등기부등본)', desc: '근저당·가압류·경매개시결정 말소 확인' },
                    { k: 'doc_building', title: '건축물대장(표제부·전유부)', desc: '위반건축물 등재 여부·용도 확인' },
                    { k: 'doc_land', title: '토지대장·지적도', desc: '면적·지목·경계 확인' },
                    { k: 'doc_landplan', title: '토지이용계획확인원', desc: '규제·용도지역 확인' },
                    { k: 'doc_auction_permit', title: '낙찰허가결정문 사본', desc: '취득 원인·취득가액 증빙' },
                    { k: 'doc_dividend', title: '배당표 / 대금납부영수증', desc: '낙찰대금 배분 및 납부 확인' },
                    { k: 'doc_acq_tax', title: '취득세·등록면허세 납부영수증', desc: '양도세 필요경비 입증' },
                    { k: 'doc_scrivener', title: '법무사 등기비용 영수증', desc: '양도세 필요경비 입증' },
                    { k: 'doc_repair_tax', title: '수리·보수비 세금계산서 (샷시·보일러·방수 등)', desc: '자본적지출 필요경비 입증' }
                  ].map(item => (
                    <label key={item.k} className="flex items-center justify-between p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                      <div className="flex items-center gap-2.5">
                        <input
                          type="checkbox"
                          checked={Boolean(saleData.checkedItems[item.k])}
                          onChange={() => toggleCheck(item.k)}
                          className="w-4 h-4 rounded text-blue-600"
                        />
                        <span className="font-bold text-slate-800">{item.title}</span>
                      </div>
                      <span className="text-slate-500">{item.desc}</span>
                    </label>
                  ))}
                </div>
              </div>

              {/* 계약 체결 단계 & 세입자 보증금 승계 & 최종 체크리스트 */}
              <div className="space-y-6">
                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
                  <h3 className="font-bold text-slate-900 text-base">5~6. 계약 체결 단계 및 세입자 보증금 승계 필수 서류</h3>
                  <div className="p-3 rounded-xl bg-amber-50 border border-amber-200 text-xs text-amber-900">
                    <strong>보증금 승계 원칙:</strong> 매매대금 = 건물가({formatKRW(salePrice)}) − 세입자 보증금 총액({formatKRW(totalDeposit)}) → 매수인이 보증금을 승계(안고)한 뒤 잔금({formatKRW(netCashNeededByBuyer)}) 지급
                  </div>
                  <div className="space-y-2 text-xs">
                    {[
                      { k: 'suc_confirm', title: '임대차계약 승계 확인서 징구' },
                      { k: 'suc_consent', title: '보증금 승계 동의서 징구' },
                      { k: 'suc_settle', title: '세입자 퇴거·정산 합의서' },
                      { k: 'cnt_contract', title: '매매계약서 (보증금 승계 조건 명기) 및 중개대상물 확인·설명서' },
                      { k: 'cnt_transfer', title: '잔금일 소유권이전등기 서류 (매도용 인감증명서, 등기권리증, 주민등록초본)' }
                    ].map(item => (
                      <label key={item.k} className="flex items-center gap-2.5 p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={Boolean(saleData.checkedItems[item.k])}
                          onChange={() => toggleCheck(item.k)}
                          className="w-4 h-4 rounded text-blue-600"
                        />
                        <span className="font-bold text-slate-800">{item.title}</span>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-3">
                  <h3 className="font-bold text-slate-900 text-base">7~8. 절세 체크 및 최종 매도 직전 요약 체크리스트</h3>
                  <div className="space-y-2 text-xs">
                    {[
                      { k: 'tax_timing', title: '매도 시점 조정 (2026년 11월 이후 잔금·등기 → 단기 60%에서 기본세율 6~45% 전환)' },
                      { k: 'tax_1house', title: '다가구주택(단독주택) 1세대 1주택 비과세 요건(2년 보유) 세무사 최종 확인' },
                      { k: 'tax_nonreg', title: '포항시 남구 비조정대상지역 거주요건 미적용 여부 세무사 확인' },
                      { k: 'tax_deadline', title: '양도소득세 신고·납부 기한 체크 (양도일이 속하는 달의 말일부터 2개월 이내)' }
                    ].map(item => (
                      <label key={item.k} className="flex items-center gap-2.5 p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
                        <input
                          type="checkbox"
                          checked={Boolean(saleData.checkedItems[item.k])}
                          onChange={() => toggleCheck(item.k)}
                          className="w-4 h-4 rounded text-emerald-600"
                        />
                        <span className="font-bold text-slate-800">{item.title}</span>
                      </label>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* In-Page Modal Fallback for Auction Acquisition Cost Calculator */}
          {isCostModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden my-auto">
                <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-base">경매취득 원가 및 자본적 필요경비 계산기</h3>
                    <p className="text-xs text-slate-300">입력 즉시 [취득 및 자본적 필요경비(원)]에 실시간 연동됩니다.</p>
                  </div>
                  <button onClick={() => setIsCostModalOpen(false)} className="text-slate-400 hover:text-white cursor-pointer">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>
                <div className="p-5 space-y-4 max-h-[80vh] overflow-y-auto text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {[
                      { k: 'winningBid', label: '낙찰대금 (매각허가결정/대금납부영수증)' },
                      { k: 'acquisitionTax', label: '취득세 납부영수증' },
                      { k: 'registrationFee', label: '등록 관련 비용 (채권·인지·증지)' },
                      { k: 'judicialScrivenerFee', label: '법무사 비용' },
                      { k: 'auctionMiscFee', label: '경매 관련 비용' },
                      { k: 'ownershipTransferFee', label: '소유권이전 비용' }
                    ].map(f => (
                      <div key={f.k}>
                        <label className="block font-bold text-slate-700 mb-1">{f.label}</label>
                        <input
                          type="number"
                          step="10000"
                          value={saleData.auctionCosts[f.k]}
                          onChange={(e) => handleCostFieldChange(f.k, Number(e.target.value) || 0)}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                        />
                      </div>
                    ))}
                  </div>
                  <div className="border-t pt-3">
                    <h4 className="font-bold text-emerald-800 mb-2">자본적 지출 공사자료 (샷시·보일러·배관·전기·욕실·주방·방수·외벽·지붕)</h4>
                    <div className="grid grid-cols-3 gap-2.5">
                      {[
                        { k: 'capSash', label: '샷시' },
                        { k: 'capBoiler', label: '보일러' },
                        { k: 'capPlumbing', label: '배관' },
                        { k: 'capElectric', label: '전기' },
                        { k: 'capBathroom', label: '욕실' },
                        { k: 'capKitchen', label: '주방' },
                        { k: 'capWaterproof', label: '방수' },
                        { k: 'capExterior', label: '외벽' },
                        { k: 'capRoof', label: '지붕' }
                      ].map(f => (
                        <div key={f.k}>
                          <label className="block font-bold text-slate-700 mb-1">{f.label}</label>
                          <input
                            type="number"
                            step="10000"
                            value={saleData.auctionCosts[f.k]}
                            onChange={(e) => handleCostFieldChange(f.k, Number(e.target.value) || 0)}
                            className="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 font-bold"
                          />
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="bg-slate-900 text-white p-4 rounded-xl flex items-center justify-between">
                    <div>
                      <span className="text-slate-400 block">취득 및 자본적 필요경비 총합계</span>
                      <strong className="text-lg text-emerald-400">{formatKRW(totalAcquisitionAndCapCost)}</strong>
                    </div>
                    <button
                      onClick={() => setIsCostModalOpen(false)}
                      className="px-5 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold cursor-pointer"
                    >
                      반영 완료
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
