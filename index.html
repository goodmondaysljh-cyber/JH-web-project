    const formatKRW = (num) => {
      const val = Math.round(Number(num) || 0);
      return val.toLocaleString('ko-KR') + '원';
    };

    const parseDate = (dateStr) => {
      if (!dateStr || typeof dateStr !== 'string') return new Date();
      const parts = dateStr.trim().split(/[-./]/).map(Number);
      if (parts.length >= 3 && !isNaN(parts[0]) && !isNaN(parts[1]) && !isNaN(parts[2])) {
        const y = parts[0] < 100 ? 2000 + parts[0] : parts[0];
        return new Date(y, parts[1] - 1, parts[2]);
      }
      return new Date(dateStr);
    };

    const formatDateStr = (dateObj) => {
      if (!(dateObj instanceof Date) || isNaN(dateObj.getTime())) return '';
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    // Normalize any Excel date (Serial number, Date object, or string like 2026.10.05 / 2026/10/5) into YYYY-MM-DD
    const normalizeExcelDate = (val) => {
      if (!val && val !== 0) return '';
      if (val instanceof Date) {
        return formatDateStr(val);
      }
      if (typeof val === 'number') {
        // Excel serial date to JS Date
        const utcDays = Math.floor(val - 25569);
        const utcValue = utcDays * 86400;
        const dateInfo = new Date(utcValue * 1000);
        return formatDateStr(dateInfo);
      }
      const str = String(val).trim();
      // Match YYYY-MM-DD, YYYY.MM.DD, YYYY/MM/DD, YY-MM-DD
      const match = str.match(/^(\d{2,4})[-./년\s]+(\d{1,2})[-./월\s]+(\d{1,2})/);
      if (match) {
        const year = match[1].length === 2 ? `20${match[1]}` : match[1];
        const month = String(Number(match[2])).padStart(2, '0');
        const day = String(Number(match[3])).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      const parsed = new Date(str);
      if (!isNaN(parsed.getTime())) {
        return formatDateStr(parsed);
      }
      return '';
    };

    const parseNumberClean = (val) => {
      if (typeof val === 'number') return val;
      if (!val) return 0;
      const cleaned = String(val).replace(/[^0-9.-]/g, '');
      const num = parseFloat(cleaned);
      return isNaN(num) ? 0 : num;
    };

    const getDaysDiff = (startStr, endStr) => {
      if (!startStr || !endStr) return 0;
      const s = parseDate(startStr);
      const e = parseDate(endStr);
      const diff = Math.round((e - s) / (1000 * 60 * 60 * 24));
      return diff > 0 ? diff : 0;
    };

    const getMonthTotalDays = (year, month) => {
      return new Date(year, month, 0).getDate();

      if (!checkInStr || !checkOutStr) return 0;
      const start = parseDate(checkInStr);
      const end = parseDate(checkOutStr);
      const monthStart = new Date(year, month - 1, 1);
      const monthEnd = new Date(year, month, 1);
      const overlapStart = start > monthStart ? start : monthStart;
      const overlapEnd = end < monthEnd ? end : monthEnd;
      if (overlapEnd <= overlapStart) return 0;
      return Math.round((overlapEnd - overlapStart) / (1000 * 60 * 60 * 24));
    };

    const STORAGE_KEY = 'POHANG_DAEDO_RENTAL_DATA_V1';
    const AUTH_KEY = 'POHANG_DAEDO_AUTH_V1';
    const AUTH_USER_KEY = 'POHANG_DAEDO_AUTH_USER_V1';

    const STATUS_BADGE_CONFIG = {

      upcoming: { label: '입실 예정', bg: 'bg-purple-100', text: 'text-purple-800', dot: 'bg-purple-600', border: 'border-purple-200' },
      vacant:   { label: '공실', bg: 'bg-slate-100', text: 'text-slate-700', dot: 'bg-slate-400', border: 'border-slate-200' }
    };

    // Migrate old LocalStorage structure seamlessly
    const upgradeStoredData = (parsed) => {
      const defaults = createInitialData();
      return {
        systemConfig: parsed.systemConfig || defaults.systemConfig,
        rooms: Array.isArray(parsed.rooms) && parsed.rooms.length > 0 ? parsed.rooms : defaults.rooms,
        platforms: Array.isArray(parsed.platforms) && parsed.platforms.length > 0 ? parsed.platforms : defaults.platforms,
        admins: Array.isArray(parsed.admins) && parsed.admins.length > 0 ? parsed.admins : defaults.admins,
        reservations: Array.isArray(parsed.reservations) ? parsed.reservations : defaults.reservations,
        expenses: Array.isArray(parsed.expenses) ? parsed.expenses : defaults.expenses
      };
    };

    // --- Main Application ---
    function App() {
      // Persistent App Data
      const [appData, setAppData] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed) {
              return upgradeStoredData(parsed);
            }
          }
        } catch (e) {
          console.error('Failed to load from LocalStorage:', e);
        }
        const initial = createInitialData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
        return initial;
      });

      // Auth state
      const [isLoggedIn, setIsLoggedIn] = useState(() => {
        return localStorage.getItem(AUTH_KEY) === 'true';
      });
      const [currentAdmin, setCurrentAdmin] = useState(() => {
        try {
          const savedUser = localStorage.getItem(AUTH_USER_KEY);
          if (savedUser) return JSON.parse(savedUser);
        } catch (e) {}
        return { username: 'admin', displayName: '포항대도 총괄관리자', role: '대표 관리자' };
      });

      // Navigation Tab: 'dashboard' | 'rooms' | 'reservations' | 'settlement' | 'cleaning' | 'settings'
      const [activeTab, setActiveTab] = useState('dashboard');
      const [settingsSubTab, setSettingsSubTab] = useState('rooms'); // 'rooms' | 'platforms' | 'admins' | 'excel'

      // Selected Year & Month
      const [selectedYear, setSelectedYear] = useState(() => new Date().getFullYear());
      const [selectedMonth, setSelectedMonth] = useState(() => new Date().getMonth() + 1);

      // Save to LocalStorage whenever appData changes
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
        } catch (e) {
          console.error('Failed to save to LocalStorage:', e);
        }
      }, [appData]);

      // Modal states
      const [isResModalOpen, setIsResModalOpen] = useState(false);
      const [editingReservation, setEditingReservation] = useState(null);
      const [defaultModalRoom, setDefaultModalRoom] = useState('101');
      const [defaultModalDate, setDefaultModalDate] = useState('');

      const [isExpModalOpen, setIsExpModalOpen] = useState(false);
      const [isPhoneSyncModalOpen, setIsPhoneSyncModalOpen] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      // Smartphone SMS Gateway / Webhook Config State
      const [phoneGatewayConfig, setPhoneGatewayConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('POHANG_DAEDO_PHONE_GATEWAY_V1');
          if (saved) return JSON.parse(saved);
        } catch (e) {}
        return {
          enabled: false,
          senderPhone: '010-0000-0000',
          webhookUrl: '',
          apiSecret: '',
          autoOpenQrOnPc: true
        };
      });

      // Automated Guest SMS Modal & Templates State
      const [smsModalState, setSmsModalState] = useState({
        isOpen: false,
        reservation: null,
        defaultTemplate: 'confirm'
      });
      const [smsTemplates, setSmsTemplates] = useState(() => {
        try {
          const saved = localStorage.getItem(SMS_TEMPLATES_STORAGE_KEY);
          if (saved) return { ...DEFAULT_SMS_TEMPLATES, ...JSON.parse(saved) };
        } catch (e) {}
        return DEFAULT_SMS_TEMPLATES;
      });

      // --- Company PC Server Sync Engine (HTTP + JSON DB Real-Time Sync) ---
      const [customServerUrl, setCustomServerUrl] = useState(() => {
        try {
          return localStorage.getItem('POHANG_DAEDO_SERVER_URL_V1') || '';
        } catch (e) {
          return '';
        }
      });
      const [serverStatus, setServerStatus] = useState({
        connected: false,
        checking: false,
        version: 0,
        updatedAt: null,
        localUrls: [],
        ips: [],
        port: 8080,
        hostname: ''
      });
      const serverVersionRef = useRef(0);
      const suppressNextPushRef = useRef(false);
      const pushTimerRef = useRef(null);

      const getApiBaseUrl = () => {
        if (customServerUrl && customServerUrl.trim()) {
          return customServerUrl.trim().replace(/\/+$/, '');
        }
        if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
          return '';
        }
        return null;
      };

      const readSaleTaxFromLocal = () => {
        try {
          const raw = localStorage.getItem(SALE_TAX_STORAGE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      };

      const applyServerDataPayload = (data) => {
        if (!data) return;
        suppressNextPushRef.current = true;
        serverVersionRef.current = Number(data.version || 0);
        if (data.appData) {
          setAppData(upgradeStoredData(data.appData));
        }
        if (data.smsTemplates) {
          const mergedTpl = { ...DEFAULT_SMS_TEMPLATES, ...data.smsTemplates };
          setSmsTemplates(mergedTpl);
          try { localStorage.setItem(SMS_TEMPLATES_STORAGE_KEY, JSON.stringify(mergedTpl)); } catch (e) {}
        }
        if (data.phoneGatewayConfig) {
          setPhoneGatewayConfig(data.phoneGatewayConfig);
          try { localStorage.setItem('POHANG_DAEDO_PHONE_GATEWAY_V1', JSON.stringify(data.phoneGatewayConfig)); } catch (e) {}
        }
        if (data.saleTaxData) {
          try {
            localStorage.setItem(SALE_TAX_STORAGE_KEY, JSON.stringify(data.saleTaxData));
            window.dispatchEvent(new Event('daedo-sale-tax-synced'));
          } catch (e) {}
        }
      };

      const pushFullDataToServer = async (baseUrl, overrideAppData = null) => {
        if (baseUrl === null) return false;
        try {
          const resp = await fetch(`${baseUrl}/api/data`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              appData: overrideAppData || appData,
              smsTemplates,
              phoneGatewayConfig,
              saleTaxData: readSaleTaxFromLocal()
            })
          });
          if (!resp.ok) return false;
          const result = await resp.json();
          if (result && result.version) {
            serverVersionRef.current = Number(result.version);
            setServerStatus(prev => ({
              ...prev,
              connected: true,
              version: result.version,
              updatedAt: result.updatedAt || prev.updatedAt
            }));
          }
          return true;
        } catch (e) {
          return false;
        }
      };

      const connectAndSyncServer = async (silent = false) => {
        const baseUrl = getApiBaseUrl();
        if (baseUrl === null) {
          setServerStatus(prev => ({ ...prev, connected: false, checking: false }));
          return false;
        }
        if (!silent) {
          setServerStatus(prev => ({ ...prev, checking: true }));
        }
        try {
          const [infoResp, dataResp] = await Promise.all([
            fetch(`${baseUrl}/api/server-info`),
            fetch(`${baseUrl}/api/data`)
          ]);
          if (!infoResp.ok || !dataResp.ok) throw new Error('Server unreachable');
          const info = await infoResp.json();
          const dbData = await dataResp.json();

          setServerStatus({
            connected: true,
            checking: false,
            version: dbData.version || 0,
            updatedAt: dbData.updatedAt || info.updatedAt,
            localUrls: info.localUrls || [],
            ips: info.ips || [],
            port: info.port || 8080,
            hostname: info.hostname || ''
          });

          if (dbData && dbData.version > 0 && dbData.appData) {
            if (Number(dbData.version) !== serverVersionRef.current) {
              applyServerDataPayload(dbData);
            }
          } else {
            // Initialize empty company PC server DB with current browser data
            await pushFullDataToServer(baseUrl);
          }
          return true;
        } catch (e) {
          setServerStatus(prev => ({ ...prev, connected: false, checking: false }));
          return false;
        }
      };

      // Initial server detection + Service Worker registration for mobile PWA app install
      useEffect(() => {
        if ((window.location.protocol === 'http:' || window.location.protocol === 'https:') && 'serviceWorker' in navigator) {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
        connectAndSyncServer(false);
      }, [customServerUrl]);

      // Background polling every 4 seconds so PC & Smartphone see updates in real time
      useEffect(() => {
        const baseUrl = getApiBaseUrl();
        if (baseUrl === null) return;
        const timer = setInterval(async () => {
          try {
            const resp = await fetch(`${baseUrl}/api/health`);
            if (!resp.ok) return;
            const health = await resp.json();
            if (health && health.serverMode) {
              if (!serverStatus.connected) {
                connectAndSyncServer(true);
              } else if (Number(health.version || 0) > serverVersionRef.current) {
                const dataResp = await fetch(`${baseUrl}/api/data`);
                if (dataResp.ok) {
                  const dbData = await dataResp.json();
                  applyServerDataPayload(dbData);
                  setServerStatus(prev => ({
                    ...prev,
                    connected: true,
                    version: dbData.version || prev.version,
                    updatedAt: dbData.updatedAt || prev.updatedAt
                  }));
                }
              }
            }
          } catch (e) {}
        }, 4000);
        return () => clearInterval(timer);
      }, [customServerUrl, serverStatus.connected]);

      // Debounced auto-push whenever local data changes while connected to Company PC Server
      useEffect(() => {
        if (suppressNextPushRef.current) {
          suppressNextPushRef.current = false;
          return;
        }
        if (!serverStatus.connected) return;
        const baseUrl = getApiBaseUrl();
        if (baseUrl === null) return;
        if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
        pushTimerRef.current = setTimeout(() => {
          pushFullDataToServer(baseUrl);
        }, 350);
        return () => {
          if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
        };
      }, [appData, smsTemplates, phoneGatewayConfig, serverStatus.connected]);

      // Push when 7-unit sale/tax data changes locally
      useEffect(() => {
        const onSaleTaxChanged = () => {
          if (!serverStatus.connected) return;
          const baseUrl = getApiBaseUrl();
          if (baseUrl !== null) pushFullDataToServer(baseUrl);
        };
        window.addEventListener('daedo-sale-tax-changed', onSaleTaxChanged);
        return () => window.removeEventListener('daedo-sale-tax-changed', onSaleTaxChanged);
      }, [serverStatus.connected, appData, smsTemplates, phoneGatewayConfig]);

      const handleUpdateCustomServerUrl = (newUrl) => {
        const cleaned = (newUrl || '').trim().replace(/\/+$/, '');
        setCustomServerUrl(cleaned);
        try {
          if (cleaned) localStorage.setItem('POHANG_DAEDO_SERVER_URL_V1', cleaned);
          else localStorage.removeItem('POHANG_DAEDO_SERVER_URL_V1');
        } catch (e) {}
      };

      const handleUpdatePhoneGatewayConfig = (nextCfg) => {
        setPhoneGatewayConfig(nextCfg);
        try {
          localStorage.setItem('POHANG_DAEDO_PHONE_GATEWAY_V1', JSON.stringify(nextCfg));
        } catch (e) {}
        showToast('스마트폰 연동 설정이 저장되었습니다.');
      };

      const handleRestoreFullAppData = (importedData) => {
        if (!importedData || !Array.isArray(importedData.rooms) || !Array.isArray(importedData.reservations)) {
          alert('유효한 동기화 데이터 형식이 아닙니다.');
          return false;
        }
        setAppData(prev => ({
          ...prev,
          ...importedData
        }));
        showToast('스마트폰 ↔ PC 데이터가 성공적으로 동기화되었습니다!');
        return true;
      };

      const handleUpdateSmsTemplates = (nextTemplates) => {
        setSmsTemplates(nextTemplates);
        try {
          localStorage.setItem(SMS_TEMPLATES_STORAGE_KEY, JSON.stringify(nextTemplates));
        } catch (e) {}
        showToast('자동 문자 템플릿 양식이 저장되었습니다.');
      };

      const openSmsModal = (resObj, defaultTemplate = 'confirm') => {
        if (!resObj) return;
        const today = getTodayDateStr();
        let chosenTpl = defaultTemplate;
        if (!defaultTemplate || defaultTemplate === 'auto') {
          if (resObj.checkOut === today) chosenTpl = 'checkout';
          else if (resObj.checkIn === today) chosenTpl = 'checkin';
          else chosenTpl = 'confirm';
        }
        setSmsModalState({
          isOpen: true,
          reservation: resObj,
          defaultTemplate: chosenTpl
        });
      };

      const handleRecordSmsSent = (resId, templateKey, sentText) => {
        const nowStamp = new Date().toLocaleString('ko-KR', {
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit'
        });
        setAppData(prev => ({
          ...prev,
          reservations: prev.reservations.map(r => {
            if (r.id !== resId) return r;
            const prevLogs = Array.isArray(r.smsLogs) ? r.smsLogs : [];
            return {
              ...r,
              smsSent: true,
              lastSmsType: templateKey,
              lastSmsAt: nowStamp,
              smsLogs: [{ type: templateKey, sentAt: nowStamp, text: sentText }, ...prevLogs]
            };
          })
        }));
        showToast('예약자 안내 문자 발송 내역이 자동 기록되었습니다.');
      };

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => {
          setToastMsg((prev) => (prev === msg ? null : prev));
        }, 3200);
      };

      const handleLogin = (adminAccount) => {
        setIsLoggedIn(true);
        setCurrentAdmin(adminAccount);
        localStorage.setItem(AUTH_KEY, 'true');
        localStorage.setItem(AUTH_USER_KEY, JSON.stringify(adminAccount));
        showToast(`${adminAccount.displayName}(${adminAccount.username})님 환영합니다!`);
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        localStorage.removeItem(AUTH_KEY);
      };

      const handleResetDemoData = () => {
        if (window.confirm('시연용 초기 샘플 데이터로 복원하시겠습니까? (현재 추가/수정한 객실, 예약, 설정 내역이 초기화됩니다)')) {
          const seed = createInitialData();
          setAppData(seed);
          const now = new Date();
          setSelectedYear(now.getFullYear());
          setSelectedMonth(now.getMonth() + 1);
          showToast('시연용 샘플 데이터가 초기화되었습니다.');
        }
      };

      // Calculate enriched reservations
      const enrichedReservations = useMemo(() => {
        return appData.reservations.map((r) => {
          const nights = getDaysDiff(r.checkIn, r.checkOut);
          const totalAmount = Number(r.totalAmount) || 0;
          const cleaningFee = Number(r.cleaningFee) || 0;
          const commissionRate = Number(r.commissionRate) || 0;
          const commissionAmount = Math.round(totalAmount * (commissionRate / 100));
          const netProfit = totalAmount - (cleaningFee + commissionAmount);
          return {
            ...r,
            nights,
            totalAmount,
            cleaningFee,
            commissionRate,
            commissionAmount,
            netProfit
          };
        }).sort((a, b) => a.checkIn.localeCompare(b.checkIn));
      }, [appData.reservations]);

      // Determine current status of a room
      const getRoomComputedStatus = (room) => {
        if (room.manualStatus && room.manualStatus !== 'auto') {
          return room.manualStatus;
        }
        const today = getTodayDateStr();
        const roomRes = enrichedReservations.filter(r => r.roomId === room.id);

        const needsCleaning = roomRes.some(r => r.checkOut <= today && !r.cleaningDone);
        if (needsCleaning) return 'cleaning';

        const isOccupied = roomRes.some(r => r.checkIn <= today && today < r.checkOut);
        if (isOccupied) return 'occupied';

        const upcoming = roomRes.some(r => {
          if (r.checkIn > today) {
            const diff = getDaysDiff(today, r.checkIn);
            return diff <= 5;
          }
          return false;
        });
        if (upcoming) return 'upcoming';

        return 'vacant';
      };

      // Monthly KPI & Dynamic Multi-Room Occupancy Stats
      const monthlyMetrics = useMemo(() => {
        const ymPrefix = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;
        const daysInMonth = getMonthTotalDays(selectedYear, selectedMonth);
        const roomCount = Math.max(1, appData.rooms.length);

        const activeMonthReservations = enrichedReservations.filter(r => {
          const nightsInMonth = getBookedNightsInMonth(r.checkIn, r.checkOut, selectedYear, selectedMonth);
          return nightsInMonth > 0 || r.checkIn.startsWith(ymPrefix);
        });

        const totalRevenue = activeMonthReservations.reduce((sum, r) => sum + r.totalAmount, 0);
        const totalCommission = activeMonthReservations.reduce((sum, r) => sum + r.commissionAmount, 0);
        const totalCleaningFees = activeMonthReservations.reduce((sum, r) => sum + r.cleaningFee, 0);

        const monthExpenses = (appData.expenses || []).filter(e => e.date.startsWith(ymPrefix));
        const totalExtraExpenses = monthExpenses.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);

        const totalCleaningAndOpEx = totalCleaningFees + totalExtraExpenses;
        const finalNetProfit = totalRevenue - (totalCommission + totalCleaningAndOpEx);

        // Per-room occupancy calculation for all rooms
        const roomOccupancyMap = {};
        let totalBookedNights = 0;

        appData.rooms.forEach((rm) => {
          let bookedDays = 0;
          for (let d = 1; d <= daysInMonth; d++) {
            const dateStr = `${ymPrefix}-${String(d).padStart(2, '0')}`;
            const isBooked = enrichedReservations.some(
              r => r.roomId === rm.id && r.checkIn <= dateStr && dateStr < r.checkOut
            );
            if (isBooked) bookedDays++;
          }
          totalBookedNights += bookedDays;
          const rate = daysInMonth > 0 ? Number(((bookedDays / daysInMonth) * 100).toFixed(1)) : 0;
          roomOccupancyMap[rm.id] = {
            bookedNights: bookedDays,
            occupancyRate: rate
          };
        });

        const totalAvailableRoomNights = daysInMonth * roomCount;
        const occupancyRate = totalAvailableRoomNights > 0
          ? Number(((totalBookedNights / totalAvailableRoomNights) * 100).toFixed(1))
          : 0;

        return {
          daysInMonth,
          roomCount,
          totalAvailableRoomNights,
          activeMonthReservations,
          monthExpenses,
          totalRevenue,
          totalCommission,
          totalCleaningFees,
          totalExtraExpenses,
          totalCleaningAndOpEx,
          finalNetProfit,
          totalBookedNights,
          occupancyRate,
          roomOccupancyMap
        };
      }, [enrichedReservations, appData.expenses, appData.rooms, selectedYear, selectedMonth]);

      // --- CRUD Handlers ---
      const openNewReservationModal = (roomId = '', dateStr = '') => {
        const targetRoom = roomId || (appData.rooms[0]?.id || '101');
        setEditingReservation(null);
        setDefaultModalRoom(targetRoom);
        setDefaultModalDate(dateStr || getTodayDateStr());
        setIsResModalOpen(true);
      };

      const openEditReservationModal = (resObj) => {
        setEditingReservation(resObj);
        setIsResModalOpen(true);
      };

      const handleSaveReservation = (resData, autoTriggerSmsType = null) => {
        setAppData(prev => {
          const exists = prev.reservations.some(r => r.id === resData.id);
          const updatedReservations = exists
            ? prev.reservations.map(r => r.id === resData.id ? resData : r)
            : [...prev.reservations, resData];
          return { ...prev, reservations: updatedReservations };
        });
        setIsResModalOpen(false);
        showToast(editingReservation ? '예약 및 정산 정보가 수정되었습니다.' : '새 예약이 등록되었습니다.');
        if (autoTriggerSmsType) {
          openSmsModal(resData, autoTriggerSmsType);
        }
      };

      const handleDeleteReservation = (id) => {
        if (window.confirm('이 예약 내역을 삭제하시겠습니까?')) {
          setAppData(prev => ({
            ...prev,
            reservations: prev.reservations.filter(r => r.id !== id)
          }));
          setIsResModalOpen(false);
          showToast('예약 내역이 삭제되었습니다.');
        }
      };

      const handleToggleCleaningDone = (resId) => {
        setAppData(prev => ({
          ...prev,
          reservations: prev.reservations.map(r =>
            r.id === resId ? { ...r, cleaningDone: !r.cleaningDone } : r
          )
        }));
        showToast('청소 상태가 변경되었습니다.');
      };

      const handleUpdateRoomStatus = (roomId, newManualStatus) => {
        setAppData(prev => ({
          ...prev,
          rooms: prev.rooms.map(room =>
            room.id === roomId ? { ...room, manualStatus: newManualStatus } : room
          )
        }));
        showToast(`${roomId}호 상태 설정이 업데이트되었습니다.`);
      };

      const handleUpdateRoomInfo = (updatedRoom, originalId = null) => {
        setAppData(prev => {
          const targetId = originalId || updatedRoom.id;
          const idChanged = originalId && originalId !== updatedRoom.id;
          const updatedRooms = prev.rooms.map(room => room.id === targetId ? updatedRoom : room);
          const updatedReservations = idChanged
            ? prev.reservations.map(r => r.roomId === originalId ? { ...r, roomId: updatedRoom.id } : r)
            : prev.reservations;
          const updatedExpenses = idChanged
            ? (prev.expenses || []).map(e => e.roomId === originalId ? { ...e, roomId: updatedRoom.id } : e)
            : prev.expenses;
          return {
            ...prev,
            rooms: updatedRooms,
            reservations: updatedReservations,
            expenses: updatedExpenses
          };
        });
        showToast(`${updatedRoom.name} 정보가 저장되었습니다.`);
      };

      const handleAddRoom = (newRoom) => {
        if (appData.rooms.some(r => r.id === newRoom.id)) {
          alert(`이미 '${newRoom.id}' 호실 번호가 존재합니다.`);
          return false;
        }
        setAppData(prev => ({
          ...prev,
          rooms: [...prev.rooms, newRoom]
        }));
        showToast(`새 객실 [${newRoom.name}]이 추가되었습니다.`);
        return true;
      };

      const handleDeleteRoom = (roomId) => {
        if (appData.rooms.length <= 1) {
          alert('최소 1개 이상의 객실이 유지되어야 합니다.');
          return;
        }
        const resCount = appData.reservations.filter(r => r.roomId === roomId).length;
        const msg = resCount > 0
          ? `${roomId}호에 등록된 예약 ${resCount}건이 있습니다. 객실과 해당 예약 내역을 함께 삭제하시겠습니까?`
          : `${roomId}호 객실을 삭제하시겠습니까?`;
        if (window.confirm(msg)) {
          setAppData(prev => ({
            ...prev,
            rooms: prev.rooms.filter(r => r.id !== roomId),
            reservations: prev.reservations.filter(r => r.roomId !== roomId)
          }));
          showToast(`${roomId}호 객실이 삭제되었습니다.`);
        }
      };

      const handleUpdateSystemConfig = (newConfig) => {
        setAppData(prev => ({
          ...prev,
          systemConfig: { ...prev.systemConfig, ...newConfig }
        }));
        showToast('시스템 명칭 설정이 저장되었습니다.');
      };

      // Platform Settings Handlers
      const handleAddPlatform = (name, rate) => {
        const trimmed = name.trim();
        if (!trimmed) return;
        if (appData.platforms.some(p => p.name === trimmed)) {
          alert('이미 동일한 플랫폼 이름이 존재합니다.');
          return;
        }
        setAppData(prev => ({
          ...prev,
          platforms: [...prev.platforms, { id: `PLT-${Date.now()}`, name: trimmed, rate: Number(rate) || 0 }]
        }));
        showToast(`플랫폼 [${trimmed}]이 추가되었습니다.`);
      };

      const handleUpdatePlatform = (id, oldName, newName, newRate) => {
        const trimmed = newName.trim();
        if (!trimmed) return;
        setAppData(prev => ({
          ...prev,
          platforms: prev.platforms.map(p => p.id === id ? { ...p, name: trimmed, rate: Number(newRate) || 0 } : p),
          // Also sync existing reservations that used oldName
          reservations: oldName && oldName !== trimmed
            ? prev.reservations.map(r => r.platform === oldName ? { ...r, platform: trimmed } : r)
            : prev.reservations
        }));
        showToast(`플랫폼 [${trimmed}] 설정이 변경되었습니다. (기존 예약 자동 연동)`);
      };

      const handleDeletePlatform = (id, name) => {
        if (appData.platforms.length <= 1) {
          alert('최소 1개 이상의 플랫폼이 있어야 합니다.');
          return;
        }
        if (window.confirm(`'${name}' 플랫폼을 목록에서 삭제하시겠습니까?`)) {
          setAppData(prev => ({
            ...prev,
            platforms: prev.platforms.filter(p => p.id !== id)
          }));
          showToast(`플랫폼 [${name}]이 삭제되었습니다.`);
        }
      };

      // Admin Account Handlers
      const handleAddAdmin = (newAdmin) => {
        const cleanUser = newAdmin.username.trim();
        if (appData.admins.some(a => a.username === cleanUser)) {
          alert('이미 존재하는 관리자 아이디(ID)입니다.');
          return false;
        }
        setAppData(prev => ({
          ...prev,
          admins: [...prev.admins, {
            id: `ADM-${Date.now()}`,
            username: cleanUser,
            password: newAdmin.password,
            displayName: newAdmin.displayName.trim() || cleanUser,
            role: newAdmin.role || '공동 관리자',
            createdAt: getTodayDateStr()
          }]
        }));
        showToast(`관리자 계정 [${cleanUser}]이 추가되었습니다.`);
        return true;
      };

      const handleUpdateAdmin = (updatedAdmin) => {
        setAppData(prev => ({
          ...prev,
          admins: prev.admins.map(a => a.id === updatedAdmin.id ? updatedAdmin : a)
        }));
        if (currentAdmin.username === updatedAdmin.username) {
          setCurrentAdmin(updatedAdmin);
          localStorage.setItem(AUTH_USER_KEY, JSON.stringify(updatedAdmin));
        }
        showToast(`관리자 [${updatedAdmin.username}] 계정 정보가 변경되었습니다.`);
      };

      const handleDeleteAdmin = (id, username) => {
        if (appData.admins.length <= 1) {
          alert('최소 1명의 관리자 계정은 유지되어야 합니다.');
          return;
        }
        if (window.confirm(`관리자 계정 '${username}'을(를) 삭제하시겠습니까?`)) {
          setAppData(prev => ({
            ...prev,
            admins: prev.admins.filter(a => a.id !== id)
          }));
          showToast(`관리자 계정 [${username}]이 삭제되었습니다.`);
        }
      };

      // Bulk Excel Upload Handler
      const handleBulkImportReservations = (importedReservations, newRoomIdsToCreate = [], mode = 'append') => {
        setAppData(prev => {
          let updatedRooms = [...prev.rooms];
          const colorKeys = Object.keys(ROOM_COLOR_THEMES);

          newRoomIdsToCreate.forEach((rId) => {
            if (!updatedRooms.some(r => r.id === rId)) {
              const themeKey = colorKeys[updatedRooms.length % colorKeys.length];
              updatedRooms.push({
                id: rId,
                name: `${rId}호 (엑셀 자동등록)`,
                colorTheme: themeKey,
                location: `포항시 남구 대도동 ${rId}호`,
                type: '풀옵션 원룸',
                area: '26㎡ (약 8평)',
                baseWeeklyPrice: 250000,
                deposit: 300000,
                cleaningFeeDefault: 40000,
                doorlockPin: '0000*',
                wifiInfo: `Daedo_${rId}_5G`,
                manualStatus: 'auto',
                amenities: ['세탁기', '인덕션', '전자레인지', '스마트TV', '와이파이', '도어락'],
                memo: '엑셀 일괄 업로드 시 자동 생성된 호실'
              });
            }
          });

          const finalReservations = mode === 'replace'
            ? importedReservations
            : [...prev.reservations, ...importedReservations];

          return {
            ...prev,
            rooms: updatedRooms,
            reservations: finalReservations
          };
        });

        // Move calendar view to the first imported reservation's year/month so user immediately sees it
        if (importedReservations.length > 0 && importedReservations[0].checkIn) {
          const d = parseDate(importedReservations[0].checkIn);
          if (!isNaN(d.getTime())) {
            setSelectedYear(d.getFullYear());
            setSelectedMonth(d.getMonth() + 1);
          }
        }

        showToast(`엑셀 자료 총 ${importedReservations.length}건이 성공적으로 업로드되었습니다!`);
      };

      const handleAddExpense = (expObj) => {
        setAppData(prev => ({
          ...prev,
          expenses: [...(prev.expenses || []), expObj]
        }));
        setIsExpModalOpen(false);
        showToast('운영 비용 내역이 등록되었습니다.');
      };

      const handleDeleteExpense = (expId) => {
        if (window.confirm('해당 운영 비용 내역을 삭제하시겠습니까?')) {
          setAppData(prev => ({
            ...prev,
            expenses: (prev.expenses || []).filter(e => e.id !== expId)

          showToast('운영 비용 내역이 삭제되었습니다.');
        }
      };

      const handlePrevMonth = () => {
        if (selectedMonth === 1) {
          setSelectedYear(y => y - 1);

          setSelectedMonth(m => m - 1);

        { id: 'settlement', label: '매출/비용 정산', icon: 'receipt' },
        { id: 'cleaning', label: '청소 현황', icon: 'sparkles' },
        { id: 'sale_tax', label: '매도/세금 관리', icon: 'landmark' },
        { id: 'settings', label: '설정 관리', icon: 'settings' }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-900">

          <header className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">

                    <Icon name="building-2" className="w-5 h-5" />
                  </div>
                  <div className="whitespace-nowrap">
                    <div className="flex items-center gap-2 whitespace-nowrap">
                      <span className="font-bold text-sm sm:text-base tracking-tight text-slate-900 whitespace-nowrap">
                        {appData.systemConfig?.appTitle || '포항 대도동 스테이'}
                      </span>
                      <span className="hidden xl:inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-200 whitespace-nowrap shrink-0">
                        총 {appData.rooms.length}개 호실 운영 중
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-500 hidden 2xl:block whitespace-nowrap">
                      {appData.systemConfig?.appSubtitle || '단기임대 통합 운영 · 정산 관리 시스템'}
                    </p>
                  </div>
                </div>

                {/* Desktop Nav Tabs */}
                <nav className="hidden lg:flex items-center gap-0.5 bg-slate-100 p-1 rounded-xl shrink-0 whitespace-nowrap">
                  {navItems.map((item) => {
                    const active = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer whitespace-nowrap shrink-0 ${
                          active
                            ? 'bg-white text-blue-600 shadow-xs'
                            : 'text-slate-600 hover:text-slate-900 hover:bg-white/50'
                        }`}
                      >
                        <Icon name={item.icon} className="w-3.5 h-3.5" />
                        <span className="whitespace-nowrap">{item.label}</span>
                      </button>
                    );
                  })}
                </nav>

                {/* Right Action Area */}
                <div className="flex items-center gap-1.5 shrink-0 whitespace-nowrap">
                  <button
                    onClick={() => setIsPhoneSyncModalOpen(true)}
                    className={`inline-flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold border transition cursor-pointer whitespace-nowrap shrink-0 ${
                      serverStatus.connected
                        ? 'bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border-emerald-200'
                        : 'bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border-indigo-200'
                    }`}
                    title="회사 PC 서버 및 스마트폰 실시간 연동 센터 열기"
                  >
                    <span className={`w-2 h-2 rounded-full ${serverStatus.connected ? 'bg-emerald-500 animate-pulse' : 'bg-indigo-500'}`}></span>
                    <Icon name="smartphone" className="w-3.5 h-3.5" />
                    <span className="whitespace-nowrap">{serverStatus.connected ? 'PC서버·폰 연동중' : '스마트폰 연동'}</span>
                  </button>

                  <button
                    onClick={() => openNewReservationModal(appData.rooms[0]?.id || '101', getTodayDateStr())}
                    className="inline-flex items-center gap-1 px-3 py-2 rounded-xl text-xs font-semibold bg-blue-600 hover:bg-blue-700 text-white shadow-xs transition cursor-pointer whitespace-nowrap shrink-0"
                  >
                    <Icon name="plus" className="w-4 h-4" />
                    <span className="whitespace-nowrap">예약/정산 등록</span>
                  </button>

                  <button
                    onClick={handleResetDemoData}
                    title="샘플 더미 데이터 초기화"
                    className="p-2 rounded-xl text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition cursor-pointer shrink-0"
                  >
                    <Icon name="rotate-ccw" className="w-4 h-4" />
                  </button>

                  <div className="hidden lg:flex items-center gap-2 pl-2 border-l border-slate-200 shrink-0 whitespace-nowrap">
                    <div
                      onClick={() => openSettingsWithSubTab('admins')}
                      className="text-right cursor-pointer hover:opacity-80 whitespace-nowrap"
                      title="관리자 계정 설정 열기"
                    >
                      <p className="text-xs font-semibold text-slate-800 whitespace-nowrap">{currentAdmin.displayName}</p>
                      <p className="text-[10px] text-emerald-600 font-medium whitespace-nowrap">ID: {currentAdmin.username}</p>
                    </div>
                    <button
                      onClick={handleLogout}
                      title="로그아웃"

                    >
                      <Icon name="log-out" className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              </div>
            </div>

            {/* Mobile & Tablet Horizontal Navigation Bar */}
            <div className="lg:hidden border-t border-slate-100 bg-white px-2 py-1.5 overflow-x-auto">
              <div className="flex items-center gap-1 min-w-max whitespace-nowrap">
                {navItems.map((item) => {
                  const active = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => setActiveTab(item.id)}
                      className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer whitespace-nowrap shrink-0 ${
                        active
                          ? 'bg-blue-600 text-white shadow-xs'
                          : 'text-slate-600 hover:bg-slate-100'
                      }`}
                    >
                      <Icon name={item.icon} className="w-3.5 h-3.5" />
                      <span className="whitespace-nowrap">{item.label}</span>
                    </button>
                  );
                })}
                <button
                  onClick={handleLogout}
                  className="flex items-center gap-1 px-2.5 py-1.5 rounded-lg text-xs font-medium text-rose-600 hover:bg-rose-50 ml-auto cursor-pointer whitespace-nowrap shrink-0"
                >
                  <Icon name="log-out" className="w-3.5 h-3.5" />
                  <span className="whitespace-nowrap">로그아웃</span>
                </button>
              </div>
            </div>
          </header>

          {/* Sub-header Month Selector & Room Occupancy Bar */}
          <div className="bg-white border-b border-slate-200/80">
            <div className="max-w-[1440px] mx-auto px-3 sm:px-5 lg:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">

                  className="p-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-600 transition cursor-pointer"

                  <Icon name="chevron-left" className="w-4 h-4" />
                </button>
                <div className="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-100 font-bold text-slate-800 text-sm sm:text-base whitespace-nowrap">
                  <Icon name="calendar" className="w-4 h-4 text-blue-600" />
                  <span className="whitespace-nowrap">{selectedYear}년 {selectedMonth}월</span>
                </div>
                <button
                  onClick={handleNextMonth}
                  className="p-1.5 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-600 transition cursor-pointer"

                <button

                </button>

                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Main Content Container */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

              <DashboardView

              <RoomManagementView
                rooms={appData.rooms}
                platforms={appData.platforms}
                reservations={enrichedReservations}
                getRoomComputedStatus={getRoomComputedStatus}
                onUpdateRoomStatus={handleUpdateRoomStatus}
                onUpdateRoomInfo={handleUpdateRoomInfo}
                onAddRoom={handleAddRoom}
                onDeleteRoom={handleDeleteRoom}
                onOpenNewReservation={openNewReservationModal}
                onBulkImportReservations={handleBulkImportReservations}
              />

            {activeTab === 'reservations' && (
              <ReservationManagementView

                platforms={appData.platforms}

                selectedYear={selectedYear}
                selectedMonth={selectedMonth}
                onOpenNewReservation={openNewReservationModal}
                onOpenEditReservation={openEditReservationModal}
                onOpenSmsModal={openSmsModal}
                onDeleteReservation={handleDeleteReservation}
                onToggleCleaning={handleToggleCleaningDone}
                onOpenExcelUpload={() => setActiveTab('rooms')}
              />

              <SettlementView

                selectedYear={selectedYear}

    // --- 4. Integrated Monthly Calendar Component (Multi-Room Dynamic Support) ---
    function IntegratedCalendar({
      year,
      month,
      rooms,
      reservations,
      roomFilter,
      onChangeRoomFilter,
      onSelectDate,
      onSelectReservation
    }) {
      const todayStr = getTodayDateStr();

      const visibleRooms = useMemo(() => {
        if (roomFilter === 'ALL') return rooms;
        return rooms.filter(r => r.id === roomFilter);
      }, [rooms, roomFilter]);

      const calendarCells = useMemo(() => {
        const firstDayOfWeek = new Date(year, month - 1, 1).getDay();
        const daysInMonth = getMonthTotalDays(year, month);
        const cells = [];

        for (let i = 0; i < firstDayOfWeek; i++) {
          cells.push({ empty: true, key: `empty-start-${i}` });
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

          const roomBookings = {};
          const roomCheckouts = {};

          rooms.forEach(rm => {
            roomBookings[rm.id] = reservations.find(
              r => r.roomId === rm.id && r.checkIn <= dateStr && dateStr < r.checkOut
            );
            roomCheckouts[rm.id] = reservations.find(
              r => r.roomId === rm.id && r.checkOut === dateStr
            );
          });

          cells.push({
            empty: false,
            day: d,
            dateStr,
            isToday: dateStr === todayStr,
            roomBookings,
            roomCheckouts,
            key: dateStr
          });
        }

        return cells;
      }, [year, month, rooms, reservations, todayStr]);

      const weekDays = ['일', '월', '화', '수', '목', '금', '토'];

      return (
        <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
          <div className="p-4 sm:px-6 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div>
              <div className="flex items-center gap-2">
                <Icon name="calendar-days" className="w-5 h-5 text-blue-600" />
                <h3 className="font-bold text-slate-900 text-base sm:text-lg">
                  전 호실 통합 예약 캘린더 ({year}년 {month}월)
                </h3>
              </div>
              <p className="text-xs text-slate-500 mt-0.5">
                날짜 칸 클릭 시 신규 예약 등록, 예약 구간 바 클릭 시 상세 정산 수정 모달이 열립니다.
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <div className="flex flex-wrap items-center gap-2 mr-1 text-xs font-semibold">
                {rooms.map((rm, idx) => {
                  const theme = getRoomTheme(rm, idx);
                  return (
                    <span key={rm.id} className={`flex items-center gap-1.5 px-2.5 py-1 rounded-lg border ${theme.tagBg}`}>
                      <span className={`w-2.5 h-2.5 rounded-xs ${theme.dot}`}></span>
                      {rm.id}호
                    </span>
                  );
                })}
              </div>

              <div className="inline-flex flex-wrap rounded-xl bg-slate-100 p-1 text-xs font-semibold">
                <button
                  onClick={() => onChangeRoomFilter('ALL')}
                  className={`px-2.5 py-1 rounded-lg transition cursor-pointer ${
                    roomFilter === 'ALL' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  전체 보기
                </button>
                {rooms.map(rm => (
                  <button
                    key={rm.id}
                    onClick={() => onChangeRoomFilter(rm.id)}
                    className={`px-2.5 py-1 rounded-lg transition cursor-pointer ${
                      roomFilter === rm.id ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {rm.id}호만
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className="grid grid-cols-7 bg-slate-50 border-b border-slate-200 text-center text-xs font-bold text-slate-600">
            {weekDays.map((day, idx) => (
              <div
                key={day}
                className={`py-2.5 ${idx === 0 ? 'text-rose-600' : idx === 6 ? 'text-blue-600' : ''}`}
              >
                {day}
              </div>
            ))}
          </div>

          <div className="grid grid-cols-7 divide-x divide-y divide-slate-200 border-b border-slate-200">
            {calendarCells.map((cell, idx) => {
              if (cell.empty) {
                return <div key={cell.key} className="min-h-[96px] sm:min-h-[120px] bg-slate-50/50" />;
              }

              const dayOfWeek = idx % 7;

              return (
                <div
                  key={cell.key}
                  onClick={() => onSelectDate(cell.dateStr)}
                  className={`min-h-[96px] sm:min-h-[120px] p-1 sm:p-1.5 flex flex-col justify-between transition hover:bg-slate-50 cursor-pointer ${
                    cell.isToday ? 'bg-blue-50/30 ring-2 ring-inset ring-blue-500' : 'bg-white'
                  }`}
                >
                  <div className="flex items-center justify-between px-1">
                    <span
                      className={`text-xs sm:text-sm font-bold ${
                        cell.isToday
                          ? 'bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center'
                          : dayOfWeek === 0
                          ? 'text-rose-600'
                          : dayOfWeek === 6
                          ? 'text-blue-600'
                          : 'text-slate-700'
                      }`}
                    >
                      {cell.day}
                    </span>

                    <div className="flex items-center gap-0.5 flex-wrap justify-end">
                      {visibleRooms.map((rm) => {
                        const co = cell.roomCheckouts[rm.id];
                        if (!co) return null;
                        return (
                          <span
                            key={rm.id}
                            title={`${rm.id}호 ${co.guestName} 퇴실일`}
                            className="text-[10px] px-1 rounded bg-slate-100 text-slate-600 border border-slate-200 font-semibold hidden sm:inline"
                          >
                            {rm.id}퇴실
                          </span>
                        );
                      })}
                    </div>
                  </div>

                  <div className="space-y-1 mt-1">
                    {visibleRooms.map((rm) => {
                      const roomIdx = rooms.findIndex(x => x.id === rm.id);
                      const theme = getRoomTheme(rm, roomIdx >= 0 ? roomIdx : 0);
                      const booking = cell.roomBookings[rm.id];
                      const isStart = booking && booking.checkIn === cell.dateStr;

                      return (
                        <div key={rm.id} className="min-h-[22px] sm:min-h-[26px]">
                          {booking ? (
                            <div
                              onClick={(e) => {
                                e.stopPropagation();
                                onSelectReservation(booking);
                              }}
                              title={`[${rm.id}호] ${booking.guestName} (${booking.checkIn}~${booking.checkOut}, ${booking.platform})`}
                              className={`w-full px-1.5 py-0.5 sm:py-1 text-[10px] sm:text-xs font-bold truncate transition shadow-2xs ${
                                isStart ? theme.barStart : theme.barMid
                              }`}
                            >
                              <span className="hidden sm:inline">{rm.id}호 </span>
                              <span>{booking.guestName}</span>
                              {isStart && <span className="hidden md:inline text-[10px] opacity-90 ml-1">({booking.nights}박)</span>}
                            </div>
                          ) : (
                            <div className="w-full h-5 rounded border border-dashed border-slate-100 flex items-center justify-center text-[10px] text-slate-300 opacity-0 hover:opacity-100 transition">
                              + {rm.id}호
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- Reusable Excel Bulk Uploader Section ---
    function ExcelBulkUploaderSection({ rooms, platforms, onBulkImportReservations }) {
      const fileInputRef = useRef(null);
      const [excelFileName, setExcelFileName] = useState('');
      const [rawExcelRows, setRawExcelRows] = useState([]);
      const [excelHeaders, setExcelHeaders] = useState([]);
      const [columnMap, setColumnMap] = useState({
        roomId: '',
        guestName: '',
        guestPhone: '',
        checkIn: '',
        checkOut: '',
        platform: '',
        totalAmount: '',
        cleaningFee: '',
        commissionRate: '',
        memo: ''
      });
      const [importMode, setImportMode] = useState('append');
      const [fallbackRoomId, setFallbackRoomId] = useState(rooms[0]?.id || '101');
      const [autoCreateRooms, setAutoCreateRooms] = useState(true);

      const guessColumnMapping = (headers) => {
        const findCol = (keywords) => {
          return headers.find(h => keywords.some(k => String(h).toLowerCase().replace(/\s+/g, '').includes(k))) || '';
        };
        return {
          roomId: findCol(['호실', '객실', '방번호', '원룸', '호수', 'room']),
          guestName: findCol(['예약자', '성명', '이름', '임차인', '게스트', '투숙객', '고객', 'guest', 'name']),
          guestPhone: findCol(['연락처', '전화', '휴대폰', '핸드폰', 'phone', 'tel']),
          checkIn: findCol(['입실', '체크인', '시작일', '계약시작', '입주일', 'checkin', 'start']),
          checkOut: findCol(['퇴실', '체크아웃', '종료일', '계약종료', '만기일', 'checkout', 'end']),
          platform: findCol(['플랫폼', '경로', '채널', '사이트', '예약처', 'platform']),
          totalAmount: findCol(['결제금액', '총금액', '임대료', '총매출', '매출', '입금액', '요금', '금액', 'amount', 'price']),
          cleaningFee: findCol(['청소비', '청소', '관리비', 'cleaning']),
          commissionRate: findCol(['수수료율', '수수료', '요율', 'commission', 'fee']),
          memo: findCol(['메모', '비고', '특이사항', '참고', '내역', 'memo', 'note'])
        };
      };

      const handleExcelFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setExcelFileName(file.name);

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array', cellDates: true });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonRows = window.XLSX.utils.sheet_to_json(worksheet, { defval: '' });

            if (jsonRows.length === 0) {
              alert('엑셀 파일에 데이터가 없습니다.');
              return;
            }
            const headers = Object.keys(jsonRows[0]);
            setExcelHeaders(headers);
            setRawExcelRows(jsonRows);
            setColumnMap(guessColumnMapping(headers));
          } catch (err) {
            console.error(err);
            alert('엑셀 파일을 읽는 중 오류가 발생했습니다. (.xlsx, .xls, .csv 파일인지 확인해주세요)');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const handleDownloadSampleExcel = () => {
        if (!window.XLSX) return;
        const sampleRows = [
          {
            '호실': '101호',
            '예약자명': '강동원',
            '연락처': '010-1111-2222',
            '입실일': '2026-10-03',
            '퇴실일': '2026-10-10',
            '플랫폼': '삼삼엠투',
            '총결제금액': 350000,
            '청소비용': 40000,
            '수수료율': 3.3,
            '비고': '포항 출장 1주일'
          },
          {
            '호실': '102호',
            '예약자명': '김태리',
            '연락처': '010-3333-4444',
            '입실일': '2026-10-12',
            '퇴실일': '2026-10-20',
            '플랫폼': '에어비앤비',
            '총결제금액': 520000,
            '청소비용': 45000,
            '수수료율': 14.0,
            '비고': '관광 및 워케이션'
          }
        ];
        const ws = window.XLSX.utils.json_to_sheet(sampleRows);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, '단기임대_업로드양식');
        window.XLSX.writeFile(wb, '포항대도동_단기임대_엑셀업로드_샘플양식.xlsx');
      };

      const parsedExcelPreview = useMemo(() => {
        if (!rawExcelRows.length) return [];
        return rawExcelRows.map((row, idx) => {
          let rawRoom = columnMap.roomId ? String(row[columnMap.roomId] || '').trim() : '';
          rawRoom = rawRoom.replace(/호$/g, '').trim();
          const finalRoomId = rawRoom || fallbackRoomId;

          const guestName = columnMap.guestName ? String(row[columnMap.guestName] || '').trim() : `예약자-${idx + 1}`;
          const guestPhone = columnMap.guestPhone ? String(row[columnMap.guestPhone] || '').trim() : '';

          const checkIn = columnMap.checkIn ? normalizeExcelDate(row[columnMap.checkIn]) : '';
          let checkOut = columnMap.checkOut ? normalizeExcelDate(row[columnMap.checkOut]) : '';

          if (checkIn && (!checkOut || checkOut <= checkIn)) {
            const d = parseDate(checkIn);
            d.setDate(d.getDate() + 7);
            checkOut = formatDateStr(d);
          }

          const platformName = columnMap.platform ? String(row[columnMap.platform] || '').trim() : (platforms[0]?.name || '삼삼엠투');
          const matchedPlatform = platforms.find(p => p.name === platformName);
          const totalAmount = columnMap.totalAmount ? parseNumberClean(row[columnMap.totalAmount]) : 0;

          const matchedRoom = rooms.find(r => r.id === finalRoomId);
          const cleaningFee = columnMap.cleaningFee && row[columnMap.cleaningFee] !== ''
            ? parseNumberClean(row[columnMap.cleaningFee])
            : (matchedRoom ? matchedRoom.cleaningFeeDefault : 40000);

          let commissionRate = matchedPlatform ? matchedPlatform.rate : 3.3;
          if (columnMap.commissionRate && row[columnMap.commissionRate] !== '') {
            const rawComm = parseNumberClean(row[columnMap.commissionRate]);
            if (rawComm > 100 && totalAmount > 0) {
              commissionRate = Number(((rawComm / totalAmount) * 100).toFixed(1));
            } else if (rawComm >= 0 && rawComm <= 100) {
              commissionRate = rawComm;
            }
          }

          const memo = columnMap.memo ? String(row[columnMap.memo] || '').trim() : '';
          const nights = getDaysDiff(checkIn, checkOut);
          const isValid = Boolean(guestName && checkIn && checkOut && nights > 0);

          return {
            id: `RES-XLS-${Date.now()}-${idx}`,
            roomId: finalRoomId,
            guestName: guestName || `게스트${idx + 1}`,
            guestPhone,
            checkIn,
            checkOut,
            nights,
            platform: platformName || '기타',
            totalAmount,
            cleaningFee,
            commissionRate,
            cleaningDone: checkOut < getTodayDateStr(),
            cleanerName: '박여사님',
            memo,
            isValid
          };
        });
      }, [rawExcelRows, columnMap, fallbackRoomId, platforms, rooms]);

      const validExcelRows = parsedExcelPreview.filter(r => r.isValid);

      const handleConfirmExcelImport = () => {

            </div>

      );

    // --- 5. Room Management View (객실 관리 탭 - 객실 추가 & 이름 변경 & 엑셀 일괄 업로드 포함) ---

    // --- 6. Reservation Management View ---
    function ReservationManagementView({
      rooms,
      platforms,
      reservations,
      selectedYear,
      selectedMonth,
      onOpenNewReservation,
      onOpenEditReservation,
      onOpenSmsModal,
      onDeleteReservation,
      onToggleCleaning,
      onOpenExcelUpload
    }) {
      const [roomFilter, setRoomFilter] = useState('ALL');
      const [platformFilter, setPlatformFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [viewScope, setViewScope] = useState('ALL');

      const ymPrefix = `${selectedYear}-${String(selectedMonth).padStart(2, '0')}`;

      const filteredList = useMemo(() => {
        return reservations.filter((r) => {
          if (roomFilter !== 'ALL' && r.roomId !== roomFilter) return false;
          if (platformFilter !== 'ALL' && r.platform !== platformFilter) return false;
          if (viewScope === 'MONTH') {
            const nightsInMonth = getBookedNightsInMonth(r.checkIn, r.checkOut, selectedYear, selectedMonth);
            if (nightsInMonth === 0 && !r.checkIn.startsWith(ymPrefix)) return false;
          }
          if (searchQuery.trim()) {
            const q = searchQuery.trim().toLowerCase();
            const matchName = r.guestName.toLowerCase().includes(q);
            const matchMemo = (r.memo || '').toLowerCase().includes(q);
            const matchPlatform = r.platform.toLowerCase().includes(q);
            if (!matchName && !matchMemo && !matchPlatform) return false;
          }
          return true;
        });
      }, [reservations, roomFilter, platformFilter, viewScope, searchQuery, selectedYear, selectedMonth, ymPrefix]);

      const handleExportCurrentToExcel = () => {
        if (!window.XLSX) {
          alert('엑셀 라이브러리를 불러오는 중입니다.');
          return;
        }
        const rows = filteredList.map(r => ({
          '호실': `${r.roomId}호`,
          '예약자명': r.guestName,
          '연락처': r.guestPhone || '',
          '입실일': r.checkIn,
          '퇴실일': r.checkOut,
          '숙박일수': r.nights,
          '플랫폼': r.platform,
          '총결제금액': r.totalAmount,
          '수수료율(%)': r.commissionRate,
          '플랫폼수수료': r.commissionAmount,
          '청소비용': r.cleaningFee,
          '순수익': r.netProfit,
          '청소완료여부': r.cleaningDone ? '완료' : '대기',
          '청소담당': r.cleanerName || '',
          '메모': r.memo || ''
        }));
        const ws = window.XLSX.utils.json_to_sheet(rows);
        const wb = window.XLSX.utils.book_new();
        window.XLSX.utils.book_append_sheet(wb, ws, '예약정산목록');
        window.XLSX.writeFile(wb, `포항대도동_단기임대_예약내역_${getTodayDateStr()}.xlsx`);
      };

      return (
        <div className="space-y-5">
          <div className="bg-white rounded-2xl border border-slate-200 p-4 sm:p-5 shadow-xs space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div>
                <h2 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                  <Icon name="calendar-check-2" className="w-5 h-5 text-blue-600" />
                  <span>통합 예약 관리 목록 ({filteredList.length}건)</span>
                </h2>
                <p className="text-xs text-slate-500 mt-0.5">
                  기존에 관리하던 엑셀 리스트를 한 번에 업로드하거나 현재 내역을 엑셀로 내려받을 수 있습니다.
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                <button
                  onClick={onOpenExcelUpload}
                  className="inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-bold shadow-xs cursor-pointer"
                >
                  <Icon name="upload" className="w-4 h-4" />
                  <span>기존 엑셀 자료 일괄 업로드</span>
                </button>
                <button
                  onClick={handleExportCurrentToExcel}
                  className="inline-flex items-center gap-1.5 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-semibold cursor-pointer"
                >
                  <Icon name="download" className="w-4 h-4" />
                  <span>엑셀 다운로드</span>
                </button>
                <button
                  onClick={() => onOpenNewReservation(rooms[0]?.id || '101', getTodayDateStr())}
                  className="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-semibold shadow-xs cursor-pointer"
                >
                  <Icon name="plus" className="w-4 h-4" />
                  <span>신규 예약 추가</span>
                </button>
              </div>
            </div>

            {/* Filters Bar */}
            <div className="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-100">
              <div className="inline-flex rounded-xl bg-slate-100 p-1 text-xs font-semibold">
                <button
                  onClick={() => setViewScope('ALL')}
                  className={`px-3 py-1.5 rounded-lg cursor-pointer ${viewScope === 'ALL' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}`}
                >
                  전체 기간
                </button>
                <button
                  onClick={() => setViewScope('MONTH')}
                  className={`px-3 py-1.5 rounded-lg cursor-pointer ${viewScope === 'MONTH' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}`}
                >
                  {selectedMonth}월 예약만
                </button>
              </div>

              <select
                value={roomFilter}
                onChange={(e) => setRoomFilter(e.target.value)}
                className="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white text-slate-700"
              >
                <option value="ALL">전체 호실</option>
                {rooms.map(r => (
                  <option key={r.id} value={r.id}>{r.id}호 ({r.name})</option>
                ))}
              </select>

              <select
                value={platformFilter}
                onChange={(e) => setPlatformFilter(e.target.value)}
                className="px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white text-slate-700"
              >
                <option value="ALL">모든 플랫폼</option>
                {platforms.map(p => (
                  <option key={p.id} value={p.name}>{p.name}</option>
                ))}
              </select>

              <div className="relative flex-1 min-w-[180px]">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="예약자명, 메모, 플랫폼 검색..."
                  className="w-full pl-3.5 pr-4 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse">
                <thead>
                  <tr className="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase">
                    <th className="py-3.5 px-4">호실</th>
                    <th className="py-3.5 px-4">예약자명 / 연락처</th>
                    <th className="py-3.5 px-4">입실 ~ 퇴실</th>
                    <th className="py-3.5 px-4">숙박일수</th>
                    <th className="py-3.5 px-4">플랫폼</th>
                    <th className="py-3.5 px-4 text-right">총 결제금액</th>
                    <th className="py-3.5 px-4 text-right">수수료</th>
                    <th className="py-3.5 px-4 text-right">청소비</th>
                    <th className="py-3.5 px-4 text-right">순수익</th>
                    <th className="py-3.5 px-4 text-center">관리</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-xs sm:text-sm">
                  {filteredList.map((r) => {
                    const roomIdx = rooms.findIndex(rm => rm.id === r.roomId);
                    const theme = getRoomTheme(rooms[roomIdx], roomIdx >= 0 ? roomIdx : 0);
                    return (
                      <tr key={r.id} className="hover:bg-slate-50 transition">
                        <td className="py-3.5 px-4 whitespace-nowrap">
                          <span className={`px-2.5 py-1 rounded-lg text-xs font-bold border ${theme.tagBg}`}>
                            {r.roomId}호
                          </span>
                        </td>
                        <td className="py-3.5 px-4 whitespace-nowrap">
                          <div className="font-bold text-slate-900">{r.guestName}</div>
                          <div className="text-xs text-slate-400">{r.guestPhone || '-'}</div>
                        </td>
                        <td className="py-3.5 px-4 whitespace-nowrap">
                          <div className="font-medium text-slate-800">{r.checkIn} ~ {r.checkOut}</div>
                          {r.memo && <div className="text-[11px] text-slate-500 truncate max-w-[180px]">{r.memo}</div>}
                        </td>
                        <td className="py-3.5 px-4 whitespace-nowrap font-semibold text-blue-600">
                          {r.nights}박
                        </td>
                        <td className="py-3.5 px-4 whitespace-nowrap">
                          <span className="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 text-xs font-semibold">
                            {r.platform} ({r.commissionRate}%)
                          </span>
                        </td>
                        <td className="py-3.5 px-4 text-right font-bold text-slate-900 whitespace-nowrap">
                          {formatKRW(r.totalAmount)}
                        </td>
                        <td className="py-3.5 px-4 text-right text-amber-700 whitespace-nowrap">
                          -{formatKRW(r.commissionAmount)}
                        </td>
                        <td className="py-3.5 px-4 text-right text-rose-600 whitespace-nowrap">
                          -{formatKRW(r.cleaningFee)}
                        </td>
                        <td className="py-3.5 px-4 text-right font-extrabold text-emerald-700 whitespace-nowrap">
                          {formatKRW(r.netProfit)}

    // --- 7. Settlement & Expense View ---
    function SettlementView({
      rooms,
      metrics,
      allReservations,
      expenses,
      selectedYear,
      selectedMonth,
      onOpenNewReservation,
      onOpenEditReservation,
      onOpenExpenseModal,
      onDeleteExpense
    }) {
      const calcRoomSum = (list) => ({
        count: list.length,
        revenue: list.reduce((s, r) => s + r.totalAmount, 0),
        commission: list.reduce((s, r) => s + r.commissionAmount, 0),
        cleaning: list.reduce((s, r) => s + r.cleaningFee, 0),
        net: list.reduce((s, r) => s + r.netProfit, 0)
      });

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {rooms.map((rm, idx) => {
              const theme = getRoomTheme(rm, idx);
              const rmRes = metrics.activeMonthReservations.filter(r => r.roomId === rm.id);
              const sum = calcRoomSum(rmRes);
              const occObj = metrics.roomOccupancyMap[rm.id] || { bookedNights: 0, occupancyRate: 0 };

              return (
                <div key={rm.id} className="bg-white rounded-2xl border border-slate-200 p-5 shadow-xs space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div className="flex items-center gap-2.5">
                      <span className={`px-3 py-1 rounded-xl text-xs font-extrabold text-white ${theme.badgeBg}`}>
                        {rm.id}호
                      </span>
                      <h3 className="font-bold text-slate-900">{selectedYear}년 {selectedMonth}월 {rm.name}</h3>
                    </div>
                    <span className="text-xs font-bold text-slate-600">
                      가동률 {occObj.occupancyRate}% ({occObj.bookedNights}/{metrics.daysInMonth}박)
                    </span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-xs">
                    <div className="p-3 rounded-xl bg-slate-50">
                      <span className="text-slate-400 block">총 결제매출</span>
                      <strong className="text-slate-900 text-sm mt-0.5 block">{formatKRW(sum.revenue)}</strong>
                    </div>
                    <div className="p-3 rounded-xl bg-amber-50/60">
                      <span className="text-amber-700 block">플랫폼 수수료</span>
                      <strong className="text-amber-800 text-sm mt-0.5 block">-{formatKRW(sum.commission)}</strong>
                    </div>
                    <div className="p-3 rounded-xl bg-rose-50/60">
                      <span className="text-rose-700 block">청소비용 합계</span>
                      <strong className="text-rose-800 text-sm mt-0.5 block">-{formatKRW(sum.cleaning)}</strong>
                    </div>
                    <div className="p-3 rounded-xl bg-emerald-50/80 border border-emerald-200/60">
                      <span className="text-emerald-700 font-semibold block">객실 순수익</span>
                      <strong className="text-emerald-800 text-sm font-extrabold mt-0.5 block">{formatKRW(sum.net)}</strong>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="p-5 border-b border-slate-200 flex flex-wrap items-center justify-between gap-3">
              <div>
                <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                  <Icon name="receipt" className="w-5 h-5 text-rose-600" />
                  <span>{selectedYear}년 {selectedMonth}월 추가 운영비 지출 내역 (공과금 · 비품 · 수선비)</span>
                </h3>
                <p className="text-xs text-slate-500 mt-0.5">
